<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基地狼人殺 - 上帝專屬記分台</title>

  <!-- 門禁驗證 -->
  <script>
    if (sessionStorage.getItem("judge_auth") !== "authorized_3q9527") {
      alert("❌ 未經授權！請從首頁輸入法官密碼進入。");
      window.location.href = "index.html";
    }
  </script>

  <!-- 強制防快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- 載入板型設定檔 -->
  <script src="rules_config.js"></script>

  <style>
    body { background-color: #0b0f17; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .neon-border { border: 1px solid #21262d; }
    .gold-glow { border: 1px solid #d29922; box-shadow: 0 0 10px rgba(210, 153, 34, 0.25); }
    .dead-seat { opacity: 0.45; filter: grayscale(0.8); }
  </style>
</head>
<body class="p-3 max-w-xl mx-auto pb-32">

  <!-- 頂部功能導覽列 -->
  <header class="flex justify-between items-center py-2.5 px-3 bg-gray-900 rounded-xl neon-border mb-3 shadow">
    <div class="flex items-center gap-2">
      <span class="text-amber-400 text-lg">🪄</span>
      <div>
        <h1 class="text-sm font-bold text-gray-100 flex items-center gap-1.5">
          上帝記分主控台
          <button onclick="logoutJudge()" class="text-[10px] text-gray-400 hover:text-rose-400 border border-gray-700 px-1.5 py-0.2 rounded font-normal">登出</button>
        </h1>
        <select id="boardSelector" onchange="changeBoard(this.value)" class="bg-gray-800 text-[11px] text-amber-300 font-bold border border-gray-700 rounded px-1.5 py-0.5 mt-0.5 outline-none">
          <!-- 動態載入板型 -->
        </select>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <span id="nightRoundBadge" class="bg-indigo-950 text-indigo-300 border border-indigo-800 text-xs px-2 py-1 rounded font-bold font-mono">第 1 夜</span>
      <!-- 雙重防呆流局按鈕 -->
      <button onclick="voidCurrentGame()" class="text-xs bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-700 font-bold px-2 py-1 rounded transition flex items-center gap-1">
        <i class="fa-solid fa-ban"></i> 流局抄掉
      </button>
      <button onclick="resetGame()" class="text-xs text-gray-400 hover:text-white border border-gray-700 px-2 py-1 rounded">
        重置
      </button>
    </div>
  </header>

  <!-- 神職／民坑／狼坑三大陣營存活看板 -->
  <section class="grid grid-cols-3 gap-2 mb-3">
    <div class="bg-blue-950/30 border border-blue-900/60 rounded-xl p-2.5 text-center">
      <div class="text-[11px] text-blue-400 font-bold mb-0.5">神職存活 (GOD)</div>
      <div id="godAliveText" class="text-lg font-black text-emerald-400 font-mono">4/4</div>
    </div>
    <div class="bg-cyan-950/30 border border-cyan-900/60 rounded-xl p-2.5 text-center">
      <div class="text-[11px] text-cyan-400 font-bold mb-0.5">民坑存活 (民+混)</div>
      <div id="villagerAliveText" class="text-lg font-black text-emerald-400 font-mono">4/4</div>
    </div>
    <div class="bg-rose-950/30 border border-rose-900/60 rounded-xl p-2.5 text-center">
      <div class="text-[11px] text-rose-400 font-bold mb-0.5">狼坑存活 (WOLF)</div>
      <div id="wolfAliveText" class="text-lg font-black text-rose-400 font-mono">4/4</div>
    </div>
  </section>

  <!-- 開局配置標題列 -->
  <div class="flex justify-between items-center mb-2 px-1">
    <span class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
      <i class="fa-solid fa-users-gear text-indigo-400"></i> 開局配置：選擇板型與指派 12 席座位
    </span>
    <span class="text-[10px] text-amber-400/90 font-medium">選取他人將自動雙向對調位置</span>
  </div>

  <!-- 12 席座位核心控制網格 -->
  <main class="grid grid-cols-2 gap-2 mb-4" id="seatsGrid">
    <!-- 動態生成 12 席 -->
  </main>

  <!-- 夜間專屬動態引導面板 -->
  <section class="bg-gray-900 rounded-xl neon-border p-3 mb-4">
    <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-gray-800">
      <h2 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
        <i class="fa-solid fa-moon"></i> 當前板型夜間行動引導 (按順序睜眼)
      </h2>
      <button onclick="clearNightActions()" class="text-[10px] text-gray-400 hover:text-white border border-gray-700 px-1.5 py-0.5 rounded">清空本夜紀錄</button>
    </div>
    <div id="nightActionList" class="space-y-2">
      <!-- 根據選定板型動態渲染 -->
    </div>
  </section>

  <!-- 底部固定結算欄 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-gray-800 p-3 z-30">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="text-xs">
        <span class="text-gray-400">對局狀態：</span>
        <span id="gameStatusText" class="text-emerald-400 font-bold">進行中</span>
      </div>
      <button onclick="openSettleModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 shadow transition">
        <i class="fa-solid fa-cloud-arrow-up"></i> 結算並寫入資料庫
      </button>
    </div>
  </footer>

  <!-- 結算彈窗 -->
  <div id="settleModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-gray-700 w-full max-w-sm rounded-2xl p-4 shadow-2xl">
      <h3 class="text-sm font-bold text-gray-100 mb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-trophy text-amber-400"></i> 對局勝負結算確認
      </h3>
      <p class="text-xs text-gray-400 mb-3">請選擇獲勝陣營，確認後將同步記分至全場玩家戰績：</p>
      
      <div class="grid grid-cols-2 gap-2 mb-4">
        <button onclick="submitResult('GOOD')" class="bg-blue-900/60 hover:bg-blue-800 border border-blue-500 text-blue-200 py-3 rounded-xl font-bold text-xs">
          好人陣營獲勝
        </button>
        <button onclick="submitResult('WOLF')" class="bg-rose-900/60 hover:bg-rose-800 border border-rose-500 text-rose-200 py-3 rounded-xl font-bold text-xs">
          狼人陣營獲勝
        </button>
      </div>

      <button onclick="closeSettleModal()" class="w-full bg-gray-800 text-gray-400 py-2 rounded-lg text-xs font-bold hover:text-white">
        取消返回
      </button>
    </div>
  </div>

  <script>
    const MOCK_MEMBERS = [
      "小前 (Chien)", "郭郭", "King", "底迪", "Lucas", "提摩", 
      "hokai", "霏霏", "慶", "崇朗", "皓晴", "貓貓", "路人甲", "路人乙"
    ];

    const FALLBACK_BOARDS = {
      "預女獵白混": {
        name: "預女獵白混 (12人)",
        roles: ["預言家", "女巫", "獵人", "白癡", "混血兒", "平民", "平民", "平民", "狼人", "狼人", "狼人", "狼人"],
        nightOrder: [
          { role: "混血兒", action: "選擇支持榜樣 (僅首夜)" },
          { role: "狼人", action: "狼人請睜眼，確認隊友並選擇襲擊目標" },
          { role: "女巫", action: "女巫請睜眼，使用解藥或毒藥" },
          { role: "預言家", action: "預言家請睜眼，查驗一名玩家身份" },
          { role: "獵人", action: "獵人請睜眼，確認手勢開槍狀態" }
        ]
      }
    };

    function getActiveBoards() {
      if (typeof BOARD_DATABASE !== "undefined" && Object.keys(BOARD_DATABASE).length > 0) {
        return BOARD_DATABASE;
      }
      return FALLBACK_BOARDS;
    }

    let currentBoardKey = "預女獵白混";
    let seatsState = Array.from({ length: 12 }, (_, i) => ({
      seat: i + 1,
      playerName: MOCK_MEMBERS[i] || `選手 ${i + 1}`,
      role: "平民",
      isAlive: true,
      badge: false
    }));

    function initBoardSelector() {
      const db = getActiveBoards();
      const selector = document.getElementById("boardSelector");
      selector.innerHTML = Object.keys(db).map(key => `
        <option value="${key}" ${key === currentBoardKey ? 'selected' : ''}>
          ${db[key].name || key}
        </option>
      `).join('');
    }

    function changeBoard(key) {
      currentBoardKey = key;
      const db = getActiveBoards();
      const bData = db[key] || Object.values(db)[0];
      const rolesPool = (bData && bData.roles) ? [...bData.roles] : [];

      seatsState.forEach((s, idx) => {
        s.role = rolesPool[idx] || "平民";
        s.isAlive = true;
        s.badge = false;
      });

      renderSeats();
      updateFactionCounts();
      renderNightActions(bData);
    }

    function updateFactionCounts() {
      let godTotal = 0, godAlive = 0;
      let vilTotal = 0, vilAlive = 0;
      let wolfTotal = 0, wolfAlive = 0;

      const godRoles = ["預言家", "女巫", "獵人", "白癡", "守衛", "魔術師", "攝夢人", "騎士", "守墓人", "黑市商人"];
      const wolfRoles = ["狼人", "狼王", "狼美人", "夢魘", "石像鬼", "血月使徒"];

      seatsState.forEach(s => {
        const r = s.role;
        if (godRoles.includes(r)) {
          godTotal++;
          if (s.isAlive) godAlive++;
        } else if (wolfRoles.includes(r)) {
          wolfTotal++;
          if (s.isAlive) wolfAlive++;
        } else {
          vilTotal++;
          if (s.isAlive) vilAlive++;
        }
      });

      document.getElementById("godAliveText").innerText = `${godAlive}/${godTotal}`;
      document.getElementById("villagerAliveText").innerText = `${vilAlive}/${vilTotal}`;
      document.getElementById("wolfAliveText").innerText = `${wolfAlive}/${wolfTotal}`;

      document.getElementById("godAliveText").className = `text-lg font-black font-mono ${godAlive === 0 ? 'text-gray-500' : 'text-emerald-400'}`;
      document.getElementById("villagerAliveText").className = `text-lg font-black font-mono ${vilAlive === 0 ? 'text-gray-500' : 'text-emerald-400'}`;
      document.getElementById("wolfAliveText").className = `text-lg font-black font-mono ${wolfAlive === 0 ? 'text-gray-500' : 'text-rose-400'}`;
    }

    // 渲染座位席：解除 disabled 鎖定，標記位置，支援點擊對調
    function renderSeats() {
      const grid = document.getElementById("seatsGrid");
      if (!grid) return;

      const takenMap = {};
      seatsState.forEach(s => {
        if (s.playerName) {
          takenMap[s.playerName] = s.seat;
        }
      });

      grid.innerHTML = seatsState.map(s => {
        const playerOptions = MOCK_MEMBERS.map(m => {
          const isCurrent = (m === s.playerName);
          const occupiedSeat = takenMap[m];
          const isTakenByOther = occupiedSeat && !isCurrent;

          let label = m;
          if (isCurrent) {
            label = `✓ ${m}`;
          } else if (isTakenByOther) {
            label = `⇄ ${m} (在 #${occupiedSeat < 10 ? '0' + occupiedSeat : occupiedSeat})`;
          }

          // 不加 disabled，讓所有選手都能被點選觸發對調
          return `<option value="${m}" ${isCurrent ? 'selected' : ''}>${label}</option>`;
        }).join('');

        return `
          <div class="p-2.5 bg-gray-900 rounded-xl neon-border flex flex-col justify-between ${s.badge ? 'gold-glow' : ''} ${!s.isAlive ? 'dead-seat' : ''}">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-xs font-mono font-bold text-amber-400">#${s.seat < 10 ? '0' + s.seat : s.seat} 席位</span>
              <div class="flex gap-1 items-center">
                <button onclick="toggleBadge(${s.seat})" class="text-xs ${s.badge ? 'text-amber-400' : 'text-gray-600 hover:text-gray-400'}">👑</button>
                <button onclick="toggleAlive(${s.seat})" class="text-[10px] px-1.5 py-0.2 rounded font-bold ${s.isAlive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                  ${s.isAlive ? '存活' : '陣亡'}
                </button>
              </div>
            </div>

            <!-- 選手選單 -->
            <div class="mb-1.5">
              <select onchange="updatePlayerName(${s.seat}, this.value)" class="w-full bg-gray-800 text-xs text-gray-100 border border-gray-700 rounded px-1.5 py-1 outline-none font-bold">
                ${playerOptions}
              </select>
            </div>

            <!-- 身份顯示 -->
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-gray-400">身份</span>
              <span class="text-xs font-bold text-indigo-300 font-mono">${s.role}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // 智慧雙向對調邏輯
    function updatePlayerName(seat, newName) {
      const currentSeatObj = seatsState.find(x => x.seat === seat);
      const oldName = currentSeatObj.playerName;

      // 檢查新名字是否已經坐在其他座位
      const otherSeatObj = seatsState.find(x => x.seat !== seat && x.playerName === newName);

      if (otherSeatObj) {
        // 如果對方原本有位置，自動將原本的人換過去（互換）
        otherSeatObj.playerName = oldName;
      }

      currentSeatObj.playerName = newName;
      renderSeats();
    }

    function toggleBadge(seat) {
      seatsState.forEach(s => s.badge = (s.seat === seat ? !s.badge : false));
      renderSeats();
    }

    function toggleAlive(seat) {
      const s = seatsState.find(x => x.seat === seat);
      if (s) {
        s.isAlive = !s.isAlive;
        renderSeats();
        updateFactionCounts();
      }
    }

    function renderNightActions(boardConfig) {
      const container = document.getElementById("nightActionList");
      if (!container) return;

      let steps = (boardConfig && Array.isArray(boardConfig.nightOrder)) ? boardConfig.nightOrder : [
        { role: "狼人", action: "狼人請睜眼，選擇襲擊目標" },
        { role: "女巫", action: "女巫請睜眼，使用解藥或毒藥" },
        { role: "預言家", action: "預言家請睜眼，查驗一名玩家身份" },
        { role: "獵人", action: "獵人請睜眼，確認手勢開槍狀態" }
      ];

      container.innerHTML = steps.map((step, idx) => `
        <div class="p-2 bg-gray-800/70 rounded-lg border border-gray-700 flex flex-col gap-1.5">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-indigo-300">
              第 ${idx + 1} 步：${step.role}
            </span>
            <span class="text-[10px] bg-gray-700 text-gray-300 px-1.5 py-0.2 rounded">行動步驟</span>
          </div>
          <p class="text-[11px] text-gray-300">${step.action}</p>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[10px] text-gray-400">目標記錄：</span>
            <input type="text" placeholder="例如：2號、5號" class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-0.5 text-xs text-amber-300 outline-none">
          </div>
        </div>
      `).join('');
    }

    function clearNightActions() {
      document.querySelectorAll("#nightActionList input").forEach(input => input.value = "");
    }

    function voidCurrentGame() {
      const firstCheck = confirm("⚠️【第 1 次確認】確定要將本局遊戲【流局抄掉】嗎？\n\n• 本局將完全作廢，不計入勝率與天梯數據。\n• 即將重置所有存活狀態與夜間紀錄。");
      if (!firstCheck) return;

      const secondCheck = confirm("🚨【最終確認】請再次確認是否「確定流局」？\n\n此操作無法復原，確認後將立刻開啟全新一局！");
      if (!secondCheck) return;

      changeBoard(currentBoardKey);
      clearNightActions();
      document.getElementById("gameStatusText").innerText = "進行中 (已流局重開)";
      document.getElementById("gameStatusText").className = "text-amber-400 font-bold";
      alert("💥 本局已正式作廢流局！席位已重置完成，請重新開始。");
    }

    function openSettleModal() {
      document.getElementById("settleModal").classList.remove("hidden");
    }

    function closeSettleModal() {
      document.getElementById("settleModal").classList.add("hidden");
    }

    function submitResult(winner) {
      closeSettleModal();
      document.getElementById("gameStatusText").innerText = winner === "GOOD" ? "好人陣營獲勝" : "狼人陣營獲勝";
      document.getElementById("gameStatusText").className = winner === "GOOD" ? "text-blue-400 font-bold" : "text-rose-400 font-bold";
      alert(`🎉 對局正常結算成功！\n獲勝陣營：${winner === "GOOD" ? "好人陣營" : "狼人陣營"}`);
    }

    function resetGame() {
      if (confirm("確定要進行常規重置嗎？")) {
        changeBoard(currentBoardKey);
        clearNightActions();
      }
    }

    function logoutJudge() {
      sessionStorage.removeItem("judge_auth");
      window.location.href = "index.html";
    }

    window.onload = () => {
      initBoardSelector();
      changeBoard(currentBoardKey);
    };
  </script>
</body>
</html>
