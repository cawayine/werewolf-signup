<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基地狼人殺 - 上帝專屬記分台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- 核心：引入外部規則與板型獨立設定檔 -->
  <script src="rules_config.js"></script>

  <style>
    body { background-color: #0b0f17; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .neon-border { border: 1px solid #30363d; }
    .active-card { border-color: #388bfd; box-shadow: 0 0 12px rgba(56, 139, 253, 0.15); }
    .gold-glow { text-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
    select, input { background-color: #161b22; border-color: #30363d; color: #f0f6fc; }
    
    /* 重複玩家警示樣式（最高優先權） */
    .seat-duplicate-box {
      border: 2px solid #ef4444 !important;
      background-color: rgba(127, 29, 29, 0.3) !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4) !important;
    }
    .seat-duplicate-select {
      border: 1px solid #ef4444 !important;
      background-color: #450a0a !important;
      color: #fca5a5 !important;
      font-weight: bold !important;
    }
  </style>
</head>
<body class="p-3 max-w-xl lg:max-w-7xl mx-auto pb-28 lg:pb-10">

  <!-- 頂部狀態列 -->
  <header class="flex justify-between items-center py-2.5 px-3 bg-gray-900 rounded-xl neon-border mb-3 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
        <i class="fa-solid fa-gavel text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm lg:text-base font-black text-gray-100 flex items-center gap-1.5">
          基地狼人殺 - 上帝記分主控台
        </h1>
        <span class="text-[11px] text-amber-300 font-bold" id="currentBoardLabel">讀取中...</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="roundBadge" class="bg-indigo-950 text-indigo-300 border border-indigo-800 text-xs px-2.5 py-1 rounded font-bold font-mono">
        第 1 夜
      </span>
      <button onclick="abandonMatch()" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs px-2.5 py-1 rounded font-bold transition flex items-center gap-1">
        <i class="fa-solid fa-ban"></i> 流局作廢
      </button>
      <button onclick="resetMatch()" class="bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-gray-200 text-xs px-2.5 py-1 rounded border border-gray-700 transition">
        重置
      </button>
    </div>
  </header>

  <!-- 電腦橫式佈局容器 -->
  <div class="lg:grid lg:grid-cols-12 lg:gap-4 lg:items-start">
    
    <!-- 左側欄位（佔 7 欄）：坑位存活監控 + 12 席座位配置管理 -->
    <div class="lg:col-span-7 space-y-3 mb-3 lg:mb-0">
      
      <!-- 區塊：存活坑位即時監控面板 -->
      <section class="grid grid-cols-3 gap-2 text-center text-xs font-semibold">
        <div class="bg-gray-900 p-2.5 rounded-xl border border-blue-900/60 shadow">
          <div class="text-blue-400 font-bold">神職存活 (GOD)</div>
          <div class="text-xl font-black text-blue-200 mt-0.5 font-mono" id="godCountDisplay">0 / 0</div>
        </div>
        <div class="bg-gray-900 p-2.5 rounded-xl border border-emerald-900/60 shadow">
          <div class="text-emerald-400 font-bold">民坑存活 (民/混)</div>
          <div class="text-xl font-black text-emerald-200 mt-0.5 font-mono" id="villagerCountDisplay">0 / 0</div>
        </div>
        <div class="bg-gray-900 p-2.5 rounded-xl border border-rose-900/60 shadow">
          <div class="text-rose-400 font-bold">狼坑存活 (WOLF)</div>
          <div class="text-xl font-black text-rose-200 mt-0.5 font-mono" id="wolfCountDisplay">0 / 0</div>
        </div>
      </section>

      <!-- 區塊：開局座位與名單配置 -->
      <details open id="setupPanel" class="bg-gray-900 rounded-xl neon-border overflow-hidden shadow">
        <summary class="px-3 py-2.5 font-bold text-xs bg-gray-800/80 cursor-pointer flex justify-between items-center text-gray-200">
          <span><i class="fa-solid fa-users-gear mr-1.5 text-blue-400"></i> 開局配置：選擇板型與指派 12 席座位</span>
          <span class="text-[10px] text-gray-400 font-normal">點擊收合/展開</span>
        </summary>
        
        <div class="p-3 space-y-3">
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="text-[10px] text-amber-400 font-bold block mb-0.5">選擇遊戲板型 (動態載入)</label>
              <select id="boardSelect" onchange="onBoardSelectChange()" class="w-full text-xs rounded p-1.5 border border-amber-500/50 bg-gray-800 text-amber-200 font-bold outline-none">
              </select>
            </div>
            <div class="flex-1">
              <label class="text-[10px] text-gray-400 block mb-0.5">匯入簽到名單來源</label>
              <select id="sessionSelect" class="w-full text-xs rounded p-1.5 border outline-none">
                <option>當日簽到名單 (現場已簽到)</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 text-xs max-h-[60vh] overflow-y-auto pr-1" id="seatAssignmentGrid">
          </div>

          <button onclick="confirmSetup()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg text-xs shadow mt-2 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-check"></i> 確認座位與身分，進入第 1 夜
          </button>
        </div>
      </details>

      <!-- 電腦端專屬：左側常駐對局狀態與存檔欄 -->
      <div class="hidden lg:flex bg-gray-900 rounded-xl neon-border p-3 justify-between items-center shadow">
        <div>
          <span class="text-xs text-gray-400">目前勝負判定：</span>
          <span id="gameStatusTextDesk" class="text-sm text-emerald-400 font-bold ml-1">進行中</span>
        </div>
        <button onclick="commitMatchResults()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-cloud-arrow-up"></i> 結算並寫入資料庫
        </button>
      </div>

    </div>

    <!-- 右側欄位（佔 5 欄）：現場法官流程執行台 -->
    <div class="lg:col-span-5 space-y-3">
      
      <!-- 區塊：夜間行動流程引導 (卡片式，依板型動態生成) -->
      <section id="nightPanel" class="bg-gray-900 rounded-xl neon-border p-3 active-card shadow">
        <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-gray-800">
          <h2 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
            <i class="fa-solid fa-moon text-indigo-400"></i> 夜間行動引導 (逐夜腳本)
          </h2>
          <span class="text-[10px] text-amber-400 font-mono" id="nightPhaseHint">請照順序喚醒確認</span>
        </div>

        <!-- 動態夜間卡片容器 -->
        <div class="space-y-2 text-xs" id="nightActionsContainer">
          <!-- 由 renderNightPanel() 動態注入 -->
        </div>

        <div class="mt-3 pt-2.5 border-t border-gray-800 flex justify-end">
          <button onclick="resolveNight()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg text-xs shadow flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-sun text-amber-300"></i> 天亮結算死訊 ➔
          </button>
        </div>
      </section>

      <!-- 區塊：天亮死訊與白天票決 -->
      <section id="dayPanel" class="bg-gray-900 rounded-xl neon-border p-3 hidden shadow">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800">
          <h2 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
            <i class="fa-solid fa-sun text-amber-400"></i> 白天環節與公投
          </h2>
          <span id="nightDeathSummary" class="text-xs bg-rose-950 text-rose-300 px-2 py-0.5 rounded border border-rose-800 font-bold">
            昨夜死訊計算中
          </span>
        </div>

        <!-- 獵人/狼王開槍提示區 -->
        <div id="hunterActionBox" class="hidden mb-2.5 p-2.5 bg-amber-950/40 border border-amber-600/80 rounded-lg text-xs">
          <div class="font-bold text-amber-300 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-crosshairs"></i> <span id="gunTriggerTitle">觸發出局開槍技能：</span>
          </div>
          <div class="flex items-center gap-2">
            <span>帶走目標：</span>
            <select id="hunterTarget" class="flex-1 rounded p-1 text-xs border">
              <option value="">選擇開槍帶走對象</option>
            </select>
            <button onclick="applyHunterShot()" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-1 rounded font-bold transition">
              確定開槍
            </button>
          </div>
        </div>

        <!-- 快速歸票器 -->
        <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700 text-xs space-y-2">
          <div class="flex justify-between items-center">
            <span class="font-bold text-gray-200">🗳️ 放逐投票計票</span>
            <span class="text-[10px] text-gray-400">先選目標 ➔ 點選投票人</span>
          </div>

          <div class="flex flex-wrap gap-1.5" id="voteTargetsContainer"></div>

          <div class="text-[11px] text-gray-400 mt-2 mb-1">存活選民點擊歸票：</div>
          <div class="flex flex-wrap gap-1.5" id="votersBadgeContainer"></div>

          <div class="bg-gray-950 p-2.5 rounded border border-gray-800 text-[11px] font-mono space-y-0.5" id="voteSummaryBox">
            票型統計即時顯示於此...
          </div>

          <div class="flex justify-between items-center pt-2 border-t border-gray-700">
            <button onclick="confirmExile()" class="w-full bg-rose-600 hover:bg-rose-500 text-white text-xs py-2 px-3 rounded-lg font-bold shadow transition">
              確認放逐出局
            </button>
          </div>
        </div>

        <div class="mt-3 flex justify-between items-center">
          <button onclick="backToNight()" class="text-xs text-gray-400 hover:text-white underline">
            ↩ 返回上一夜操作
          </button>
          <button onclick="enterNextNight()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-4 rounded-lg text-xs shadow transition">
            進入下一個夜晚 ➔
          </button>
        </div>
      </section>

    </div>
  </div>

  <!-- 手機端底部固定結算列 -->
  <footer class="lg:hidden fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-gray-800 p-2.5 z-50">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="text-xs">
        <span class="text-gray-400">對局狀態：</span>
        <span id="gameStatusText" class="text-emerald-400 font-bold">進行中</span>
      </div>
      <button onclick="commitMatchResults()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow transition">
        <i class="fa-solid fa-cloud-arrow-up"></i> 結算並寫入資料庫
      </button>
    </div>
  </footer>

  <script>
    const MOCK_MEMBERS = [
      "小前 (Chien)", "郭郭", "King", "底迪", "Lucas", "提摩", 
      "hokai", "霏霏", "慶", "崇朗", "皓晴", "貓貓"
    ];

    let currentBoardKey = "";

    // 核心對局狀態與夜間記憶庫
    let gameState = {
      round: 1,
      phase: "SETUP",
      winner: null,
      policeSeat: null,
      lastExiledPlayer: null, // 記錄昨日被放逐的玩家物件（供守墓人查看）
      players: [],
      nightMemory: {
        guardLastTarget: null,
        dreamerLastTarget: null,
        nightmareLastTarget: null,
        magicianSwappedSeats: new Set(),
        witchAntidoteUsed: false,
        witchPoisonUsed: false,
        gargoyleConvertedTarget: null,
        blackMarketGifts: { seer: null, poison: null, gun: null },
        blackMarketTransformedWolf: false,
        youngWolfSoloKillUsed: false
      }
    };

    let currentVoteTarget = null;
    let votesMap = {};
    let antidoteUsedThisNight = false;

    function initBoardSelector() {
      if (typeof BOARD_DATABASE === 'undefined') {
        alert("找不到 rules_config.js 設定檔，請確認該檔案已上傳至同層目錄！");
        return;
      }
      const select = document.getElementById("boardSelect");
      const boardKeys = Object.keys(BOARD_DATABASE);
      select.innerHTML = boardKeys.map(key => `
        <option value="${key}">
          ${BOARD_DATABASE[key].name}
        </option>
      `).join('');

      currentBoardKey = boardKeys[0];
      onBoardSelectChange();
    }

    function onBoardSelectChange() {
      currentBoardKey = document.getElementById("boardSelect").value;
      const config = BOARD_DATABASE[currentBoardKey];
      document.getElementById("currentBoardLabel").innerText = config.name;
      initSeats();
      renderNightPanel(); // 切換板型時同步渲染夜間引導
    }

    function checkSeatDuplicates() {
      const selects = document.querySelectorAll("select[id^='userSelect-']");
      const counts = {};

      selects.forEach(sel => {
        const val = sel.value.trim();
        if (val !== "") counts[val] = (counts[val] || 0) + 1;
      });

      let hasDup = false;
      selects.forEach(sel => {
        const seat = sel.id.replace("userSelect-", "");
        const card = document.getElementById("seatCard-" + seat);
        const dupTag = document.getElementById("seatDupTag-" + seat);
        const currentVal = sel.value.trim();

        if (currentVal !== "" && counts[currentVal] > 1) {
          hasDup = true;
          if (card) card.classList.add("seat-duplicate-box");
          sel.classList.add("seat-duplicate-select");
          if (dupTag) dupTag.style.display = "inline-block";
        } else {
          if (card) card.classList.remove("seat-duplicate-box");
          sel.classList.remove("seat-duplicate-select");
          if (dupTag) dupTag.style.display = "none";
        }

        Array.from(sel.options).forEach(opt => {
          if (!opt.value) return;
          const isSeatedElsewhere = (counts[opt.value] > 0) && (opt.value !== currentVal);
          opt.textContent = isSeatedElsewhere ? `${opt.value} (已入座)` : opt.value;
        });

        const p = gameState.players.find(x => x.seat === parseInt(seat));
        if (p) p.name = currentVal;
      });

      return { hasDup, counts };
    }

    function initSeats() {
      const config = BOARD_DATABASE[currentBoardKey];
      const container = document.getElementById("seatAssignmentGrid");
      container.innerHTML = "";
      gameState.players = [];

      for (let i = 1; i <= config.playerCount; i++) {
        const assignedRole = config.defaultSlots[i - 1] || config.availableRoles[0];
        const assignedName = MOCK_MEMBERS[i - 1] || "";
        
        gameState.players.push({
          seat: i,
          name: assignedName,
          role: assignedRole,
          seatType: getSeatType(assignedRole),
          victoryFaction: getVictoryFaction(assignedRole),
          isAlive: true,
          hasBadge: false,
          hybridTarget: null
        });

        const card = document.createElement("div");
        card.id = "seatCard-" + i;
        card.className = "bg-gray-800/60 p-2 rounded-lg border border-gray-700 transition";

        let optionsHtml = '<option value="">-- 清空此座位 --</option>';
        MOCK_MEMBERS.forEach(m => {
          const isSel = (m === assignedName) ? 'selected' : '';
          optionsHtml += `<option value="${m}" ${isSel}>${m}</option>`;
        });

        let rolesHtml = '';
        config.availableRoles.forEach(r => {
          const isSelRole = (r === assignedRole) ? 'selected' : '';
          rolesHtml += `<option value="${r}" ${isSelRole}>${r}</option>`;
        });

        card.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-amber-400">#${i < 10 ? '0' + i : i} 席位</span>
            <div class="flex items-center gap-1">
              <span id="seatDupTag-${i}" class="text-[9px] text-rose-300 bg-rose-950 px-1 py-0.5 rounded border border-rose-700 font-bold" style="display: none;">⚠️ 重複</span>
              <span class="text-[10px] text-gray-400" id="roleTag-${i}">${assignedRole}</span>
            </div>
          </div>
          <select id="userSelect-${i}" onchange="checkSeatDuplicates()" class="w-full text-[11px] rounded p-1 mb-1 border outline-none">
            ${optionsHtml}
          </select>
          <select id="roleSelect-${i}" onchange="onRoleChange(${i})" class="w-full text-[11px] rounded p-1 border outline-none font-bold text-indigo-300">
            ${rolesHtml}
          </select>
        `;
        container.appendChild(card);
      }
      
      checkSeatDuplicates();
      updateCounts();
    }

    function getSeatType(roleName) {
      if (typeof ROLE_DEFINITIONS !== 'undefined' && ROLE_DEFINITIONS[roleName]) {
        return ROLE_DEFINITIONS[roleName].seatType;
      }
      return "VILLAGER";
    }

    function getVictoryFaction(roleName) {
      if (typeof ROLE_DEFINITIONS !== 'undefined' && ROLE_DEFINITIONS[roleName]) {
        return ROLE_DEFINITIONS[roleName].faction;
      }
      return "villager";
    }

    function onRoleChange(seat) {
      const selected = document.getElementById("roleSelect-" + seat).value;
      document.getElementById("roleTag-" + seat).innerText = selected;
      const p = gameState.players.find(x => x.seat === seat);
      p.role = selected;
      p.seatType = getSeatType(selected);
      p.victoryFaction = getVictoryFaction(selected);
      updateCounts();
    }

    function updateCounts() {
      const alive = gameState.players.filter(p => p.isAlive);
      const gods = alive.filter(p => p.seatType === "GOD").length;
      const villagers = alive.filter(p => p.seatType === "VILLAGER").length;
      const wolves = alive.filter(p => p.seatType === "WEREWOLF").length;

      const totalGods = gameState.players.filter(p => p.seatType === "GOD").length;
      const totalVillagers = gameState.players.filter(p => p.seatType === "VILLAGER").length;
      const totalWolves = gameState.players.filter(p => p.seatType === "WEREWOLF").length;

      document.getElementById("godCountDisplay").innerText = `${gods} / ${totalGods}`;
      document.getElementById("villagerCountDisplay").innerText = `${villagers} / ${totalVillagers}`;
      document.getElementById("wolfCountDisplay").innerText = `${wolves} / ${totalWolves}`;
      
      if (gameState.phase !== "SETUP") {
        checkGameOver(gods, villagers, wolves);
      }
    }

    function confirmSetup() {
      const checkResult = checkSeatDuplicates();
      const emptySeats = gameState.players.filter(p => !p.name);
      if (emptySeats.length > 0) {
        alert(`⚠️ 還有 ${emptySeats.length} 個席位尚未指派玩家（${emptySeats.map(s => s.seat + '號').join(', ')}），請指派完整後再開局！`);
        return;
      }
      if (checkResult.hasDup) {
        const dupNames = Object.keys(checkResult.counts).filter(name => checkResult.counts[name] > 1);
        alert(`⚠️ 檢測到有重複指派的玩家：【${dupNames.join('、')}】\n請修正後再開局！`);
        return;
      }

      document.getElementById("setupPanel").removeAttribute("open");
      gameState.phase = "NIGHT";
      gameState.round = 1;
      renderNightPanel();
      alert(`✅ 板型【${BOARD_DATABASE[currentBoardKey].name}】12 席已鎖定，進入第 1 夜！`);
    }

    // ========================================================
    // 動態夜間卡片引擎 (Night Action Script Engine)
    // ========================================================
    function renderNightPanel() {
      const config = BOARD_DATABASE[currentBoardKey];
      const container = document.getElementById("nightActionsContainer");
      if (!container || !config) return;
      container.innerHTML = "";

      const script = (gameState.round === 1) ? config.firstNightOrder : config.repeatingNightOrder;
      if (!script) return;

      // 名單防空保護：開局前若無存活名單，預設以 12 席作為選項來源
      let alive = gameState.players.filter(p => p.isAlive);
      if (alive.length === 0 && gameState.players.length > 0) {
        alive = gameState.players;
      }

      const aliveOptions = alive.map(p => `<option value="${p.seat}">${p.seat}號 - ${p.name || '未指派'}</option>`).join('');
      const allPlayersOptions = gameState.players.map(p => `<option value="${p.seat}">${p.seat}號 - ${p.name || '未指派'}</option>`).join('');

      script.forEach(step => {
        const card = document.createElement("div");
        card.id = `action-card-${step.id}`;
        card.className = "p-2.5 rounded-lg border text-xs shadow-sm space-y-1.5 transition";

        // 依卡片類型套用配色
        if (step.type === "GESTURE") {
          card.classList.add("bg-amber-950/30", "border-amber-700/60");
        } else if (step.type === "CONFIRM") {
          card.classList.add("bg-gray-800/80", "border-gray-700");
        } else if (step.type === "INFO") {
          card.classList.add("bg-indigo-950/40", "border-indigo-700/60");
        } else {
          card.classList.add("bg-gray-800/70", "border-gray-700");
        }

        // 1. 純確認身分卡片 (CONFIRM)
        if (step.type === "CONFIRM") {
          let targetPlayerDesc = "確認目標";
          if (step.role === "白痴" || step.role === "騎士" || step.role === "守墓人") {
            const p = gameState.players.find(x => x.role === step.role);
            targetPlayerDesc = p ? `${p.seat}號 ${p.name || ''}` : "未指派";
          } else if (step.id === "wolf_brothers_confirm") {
            const b = gameState.players.filter(x => x.role === "狼兄" || x.role === "狼弟");
            targetPlayerDesc = b.length > 0 ? b.map(x => `${x.seat}號(${x.role})`).join('、') : "未指派";
          }

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-gray-200">${step.title}</span>

            <div class="flex justify-between items-center bg-gray-900/60 p-2 rounded">
              <span class="text-gray-300 font-mono">確認目標：<strong class="text-amber-400">${targetPlayerDesc}</strong></span>
              <button onclick="markStepDone('${step.id}')" id="btn-done-${step.id}" class="bg-gray-700 text-gray-300 px-2 py-0.5 rounded text-[11px] transition">

              </button>
            </div>
          `;
        }

        // 2. 上帝手勢卡片 (GESTURE)
        else if (step.type === "GESTURE") {
          let gestureHtml = "";
          
          if (step.id === "hunter_gesture" || step.id === "wolf_king_gesture" || step.id === "gun_lucky_gesture") {
            gestureHtml = `
              <div class="flex justify-between items-center bg-gray-900/60 p-2 rounded">

                </span>
              </div>
            `;
          } else if (step.id === "converter_gesture") {
            const normalWolvesAlive = gameState.players.filter(p => p.isAlive && p.seatType === "WEREWOLF" && p.role !== "覺醒石像鬼").length;
            const canTakeBlade = (normalWolvesAlive === 0);
            gestureHtml = `
              <div class="flex justify-between items-center bg-gray-900/60 p-2 rounded">

              </div>

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-amber-300">${step.title}</span>

        // 3. 資訊展示卡片 (INFO - 守墓人)
        else if (step.type === "INFO") {
          const lastExile = gameState.lastExiledPlayer;
          let infoText = "昨日無放逐出局者";
          let badgeClass = "bg-gray-800 text-gray-400";
          if (lastExile) {
            const isWolf = (lastExile.seatType === "WEREWOLF");
            infoText = `昨日放逐 ${lastExile.seat}號(${lastExile.name || ''})：【${isWolf ? '狼人陣營' : '好人陣營'}】`;
            badgeClass = isWolf ? "bg-rose-950 text-rose-300 border border-rose-600" : "bg-blue-950 text-blue-300 border border-blue-600";
          }
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-indigo-300">${step.title}</span>
              <span class="text-[10px] text-gray-400 font-mono">${step.prompt}</span>
            </div>
            <div class="bg-gray-900/60 p-2 rounded flex justify-between items-center">

        }

        // 4. 主動技能卡片 (SKILL)
        else {
          let skillHtml = "";

          // 守衛
          if (step.id === "guard") {
            const lastTarget = gameState.nightMemory.guardLastTarget;
            skillHtml = `
              <div class="flex items-center gap-2">

                    const isLast = (p.seat === lastTarget);

            `;

          else if (step.id === "nightmare") {
            const nightmarePlayer = gameState.players.find(p => p.role === "夢魘");
            const lastTarget = gameState.nightMemory.nightmareLastTarget;
            skillHtml = `
              <div class="flex items-center gap-2">

                    const isLast = (p.seat === lastTarget);
                    return `<option value="\${p.seat}" ${isLast ? 'disabled' : ''}>${p.seat}號 - ${p.name \vert{}\vert{} ''}${isLast ? '(昨晚已恐)' : ''}</option>`;
                  }).join('')}

            `;
          }

          // 攝夢人
          else if (step.id === "dreamer") {
            const dreamerPlayer = gameState.players.find(p => p.role === "攝夢人");
            skillHtml = `
              <div class="flex items-center gap-2">
                <span class="text-gray-400">夢遊目標：</span>
                <select id="dreamerTarget" class="flex-1 rounded p-1 text-xs border">
                  <option value="">選擇夢遊玩家</option>
                  ${alive.filter(p => !dreamerPlayer || p.seat !== dreamerPlayer.seat).map(p => {
                    const isLast = (p.seat === gameState.nightMemory.dreamerLastTarget);
                    return `<option value="${p.seat}">${p.seat}號 - ${p.name \vert{}\vert{} ''}${isLast ? '(連夢死亡⚠️)' : ''}</option>`;
                  }).join('')}

            `;
          }

          // 魔術師
          else if (step.id === "magician") {
            skillHtml = `
              <div class="grid grid-cols-2 gap-2">
                <div class="flex items-center gap-1">
                  <span class="text-gray-400">目標A:</span>
                  <select id="magicianTargetA" class="w-full rounded p-1 text-xs border">
                    <option value="">選擇號碼</option>
                    ${allPlayersOptions}
                  </select>
                </div>
                <div class="flex items-center gap-1">
                  <span class="text-gray-400">目標B:</span>
                  <select id="magicianTargetB" class="w-full rounded p-1 text-xs border">
                    <option value="">選擇號碼</option>
                    ${allPlayersOptions}
                  </select>
                </div>
              </div>
            `;
          }

          // 混血兒
          else if (step.id === "hybrid") {

          else if (step.id === "gargoyle") {
            skillHtml = `

                <span class="text-gray-400">轉化目標：</span>

                  ${allPlayersOptions}
                </select>
              </div>
            `;
          }

          // 黑市商人
          else if (step.id === "black_market") {
            skillHtml = `
              <div class="space-y-1.5 bg-gray-900/60 p-2 rounded">

                  <span>🔮 查驗幸運兒：</span>
                  <select id="blackMarketSeer" class="w-36 rounded p-0.5 text-xs border">

                  </select>
                </div>
                <div class="flex items-center justify-between">
                  <span>🧪 毒藥幸運兒：</span>
                  <select id="blackMarketPoison" class="w-36 rounded p-0.5 text-xs border">
                    <option value="">選擇玩家</option>${allPlayersOptions}
                  </select>
                </div>
                <div class="flex items-center justify-between">
                  <span>🔫 獵槍幸運兒：</span>
                  <select id="blackMarketGun" class="w-36 rounded p-0.5 text-xs border">
                    <option value="">選擇玩家</option>${allPlayersOptions}
                  </select>
                </div>
              </div>
            `;
          }

          // 狼弟獨立單砍 (超級黑商板)
          else if (step.id === "wolf_younger_solo") {
            const brotherDead = !gameState.players.some(p => p.role === "狼兄" && p.isAlive);
            skillHtml = `
              <div class="flex items-center gap-2">
                <span class="text-gray-400">狼弟單獨落刀：</span>
                <select id="youngWolfTarget" class="flex-1 rounded p-1 text-xs border" ${brotherDead ? '' : 'disabled'}>
                  <option value="">${brotherDead ? '選擇單獨擊殺目標' : '狼兄尚未出局 (不可單砍)'}</option>
                  ${brotherDead ? aliveOptions : ''}
                </select>
              </div>
            `;
          }

          // 狼人 (團隊落刀)
          else if (step.id === "wolf" || step.id === "wolf_team_confirm") {
            skillHtml = `
              <div class="flex items-center gap-2">
                <span class="text-gray-400">團隊刀口：</span>
                <select id="wolfTarget" onchange="onWolfTargetChange()" class="flex-1 rounded p-1 text-xs border text-rose-300 font-bold">
                  <option value="">空刀 (不擊殺)</option>
                  ${aliveOptions}
                </select>
              </div>
            `;
          }

          // 狼美人魅惑
          else if (step.id === "wolf_beauty") {
            skillHtml = `
              <div class="flex items-center gap-2">
                <span class="text-gray-400">魅惑目標：</span>
                <select id="wolfBeautyTarget" class="flex-1 rounded p-1 text-xs border text-pink-300 font-bold">
                  <option value="">選擇魅惑玩家</option>
                  ${aliveOptions}
                </select>
              </div>
            `;
          }

          // 女巫
          else if (step.id === "witch") {
            const antidoteUsed = gameState.nightMemory.witchAntidoteUsed;
            const poisonUsed = gameState.nightMemory.witchPoisonUsed;
            skillHtml = `
              <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] text-amber-400 font-mono font-bold" id="witchRawKillHint">原始倒牌：等待落刀</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div class="bg-gray-900/80 p-2 rounded border border-gray-700 flex justify-between items-center">
                  <span>解藥</span>
                  <button id="antidoteBtn" onclick="toggleAntidote()" ${antidoteUsed ? 'disabled' : ''} class="${antidoteUsed ? 'bg-gray-800 text-gray-500' : 'bg-gray-700 text-gray-300'} text-[11px] px-2 py-0.5 rounded transition">
                    ${antidoteUsed ? '已消耗' : '未使用'}
                  </button>
                </div>
                <div class="bg-gray-900/80 p-2 rounded border border-gray-700 flex justify-between items-center">
                  <span>毒藥</span>
                  <select id="poisonTarget" onchange="onNightActionChange()" ${poisonUsed ? 'disabled' : ''} class="text-[11px] rounded p-0.5 border">
                    <option value="">${poisonUsed ? '已消耗' : '不使用'}</option>
                    ${poisonUsed ? '' : aliveOptions}
                  </select>
                </div>
              </div>
            `;
          }

          // 預言家
          else if (step.id === "seer") {
            skillHtml = `
              <div class="flex items-center gap-2">
                <span class="text-gray-400">查驗目標：</span>
                <select id="seerTarget" onchange="resolveSeerCheck()" class="flex-1 rounded p-1 text-xs border">
                  <option value="">選擇查驗目標</option>
                  ${allPlayersOptions}
                </select>
                <span id="seerResultBadge" class="bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded font-bold whitespace-nowrap">
                  待查驗
                </span>
              </div>
            `;
          }

          // 幸運兒主動技能 (超級黑商第 2 夜起)
          else if (step.id === "lucky_skill_action") {
            skillHtml = `
              <div class="bg-gray-900/60 p-2 rounded space-y-1">
                <div class="flex justify-between items-center">
                  <span>查驗幸運兒：</span>
                  <button class="bg-blue-900 text-blue-200 px-2 py-0.5 rounded">詢問查驗</button>
                </div>
                <div class="flex justify-between items-center">
                  <span>毒藥幸運兒：</span>
                  <button class="bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded">詢問用毒</button>
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="font-bold text-gray-200">${step.title}</span>
              <span class="text-[10px] text-gray-400 font-mono">${step.prompt}</span>
            </div>
            ${skillHtml}
          `;
        }

        container.appendChild(card);
      });

      antidoteUsedThisNight = false;
      onWolfTargetChange();
      updateDynamicGestureBadges();
    }

    function markStepDone(stepId) {
      const btn = document.getElementById(`btn-done-${stepId}`);
      if (btn) {
        btn.innerText = "已確認 ✓";
        btn.className = "bg-emerald-600 text-white px-2 py-0.5 rounded text-[11px] font-bold";
      }
    }

    // 女巫看到原始刀口，不經魔術師換算
    function onWolfTargetChange() {
      const elWolf = document.getElementById("wolfTarget");
      const elHint = document.getElementById("witchRawKillHint");
      if (!elWolf || !elHint) return;

      const target = parseInt(elWolf.value);
      if (target) {
        const p = gameState.players.find(x => x.seat === target);
        elHint.innerText = `原始刀口：${target} 號 (${p ? p.name : ''})`;
      } else {
        elHint.innerText = `原始刀口：空刀`;
      }
      updateDynamicGestureBadges();
    }

    function onNightActionChange() {
      updateDynamicGestureBadges();
    }

    function toggleAntidote() {
      if (gameState.nightMemory.witchAntidoteUsed) return;
      antidoteUsedThisNight = !antidoteUsedThisNight;
      const btn = document.getElementById("antidoteBtn");
      if (antidoteUsedThisNight) {
        btn.innerText = "已使用 (救人)";
        btn.className = "bg-emerald-600 text-white text-[11px] px-2 py-0.5 rounded font-bold transition";
      } else {
        btn.innerText = "未使用";
        btn.className = "bg-gray-700 text-gray-300 text-[11px] px-2 py-0.5 rounded transition";
      }
      updateDynamicGestureBadges();
    }

    // 即時動態計算手勢（獵人/狼王手勢）
    function updateDynamicGestureBadges() {
      const poisonTarget = parseInt(document.getElementById("poisonTarget")?.value || 0);
      const dreamerTarget = parseInt(document.getElementById("dreamerTarget")?.value || 0);

      // 1. 獵人開槍手勢
      const hunter = gameState.players.find(p => p.role === "獵人");
      const hunterBadge = document.getElementById("gesture-badge-hunter_gesture");
      if (hunter && hunterBadge) {
        const isPoisoned = (poisonTarget === hunter.seat);
        const isDreamKilled = (dreamerTarget === hunter.seat && gameState.nightMemory.dreamerLastTarget === hunter.seat);
        if (isPoisoned || isDreamKilled) {
          hunterBadge.innerText = "👎 技能受阻 (不可開槍)";
          hunterBadge.className = "bg-rose-950 text-rose-300 border border-rose-600 px-2 py-0.5 rounded font-bold";
        } else {
          hunterBadge.innerText = "👍 狀態良好 (可開槍)";
          hunterBadge.className = "bg-emerald-950 text-emerald-300 border border-emerald-600 px-2 py-0.5 rounded font-bold";
        }
      }

      // 2. 狼王魔術師板的狼王手勢
      const wolfKing = gameState.players.find(p => p.role === "狼王");
      const wolfKingBadge = document.getElementById("gesture-badge-wolf_king_gesture");
      if (wolfKing && wolfKingBadge) {
        let actualPoisonTarget = poisonTarget;
        const magA = parseInt(document.getElementById("magicianTargetA")?.value || 0);
        const magB = parseInt(document.getElementById("magicianTargetB")?.value || 0);
        if (magA && magB) {
          if (poisonTarget === magA) actualPoisonTarget = magB;
          else if (poisonTarget === magB) actualPoisonTarget = magA;
        }

        if (actualPoisonTarget === wolfKing.seat) {
          wolfKingBadge.innerText = "👎 已吃毒 (不可開槍)";
          wolfKingBadge.className = "bg-rose-950 text-rose-300 border border-rose-600 px-2 py-0.5 rounded font-bold";
        } else {
          wolfKingBadge.innerText = "👍 狀態良好 (可開槍)";
          wolfKingBadge.className = "bg-emerald-950 text-emerald-300 border border-emerald-600 px-2 py-0.5 rounded font-bold";
        }
      }
    }

    function resolveSeerCheck() {
      const targetSeat = parseInt(document.getElementById("seerTarget").value);
      const badge = document.getElementById("seerResultBadge");
      if (!targetSeat) {
        badge.innerText = "待查驗";
        badge.className = "bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded font-bold whitespace-nowrap";
        return;
      }
      const target = gameState.players.find(p => p.seat === targetSeat);
      const isWolf = ["狼人", "狼王", "白狼王", "狼兄", "狼弟", "夢魘", "狼美人", "覺醒石像鬼"].includes(target.role);
      badge.innerText = isWolf ? "查殺 (狼人)" : "金水 (好人)";
      badge.className = isWolf ? "bg-rose-950 text-rose-300 border border-rose-700 px-2 py-0.5 rounded font-bold whitespace-nowrap" : "bg-blue-950 text-blue-300 border border-blue-700 px-2 py-0.5 rounded font-bold whitespace-nowrap";
    }

    // ========================================================
    // 夜間天亮死訊結算引擎 (Resolve Night)
    // ========================================================
    function resolveNight() {
      let rawWolfTarget = parseInt(document.getElementById("wolfTarget")?.value || 0);
      let rawPoisonTarget = parseInt(document.getElementById("poisonTarget")?.value || 0);
      let guardTarget = parseInt(document.getElementById("guardTarget")?.value || 0);
      let dreamerTarget = parseInt(document.getElementById("dreamerTarget")?.value || 0);
      let youngWolfSolo = parseInt(document.getElementById("youngWolfTarget")?.value || 0);
      let hybridTarget = parseInt(document.getElementById("hybridTarget")?.value || 0);
      let gargoyleTarget = parseInt(document.getElementById("gargoyleTarget")?.value || 0);

      // 1. 首夜特殊身分紀錄
      if (gameState.round === 1) {
        if (hybridTarget) {
          const hybrid = gameState.players.find(p => p.role === "混血兒");
          if (hybrid) {
            hybrid.hybridTarget = hybridTarget;
            const target = gameState.players.find(p => p.seat === hybridTarget);
            hybrid.victoryFaction = (target.seatType === "WEREWOLF") ? "werewolf" : "villager";
          }
        }
        if (gargoyleTarget) {
          gameState.nightMemory.gargoyleConvertedTarget = gargoyleTarget;
        }

        // 超級黑商發禮物
        const bmSeer = parseInt(document.getElementById("blackMarketSeer")?.value || 0);
        const bmPoison = parseInt(document.getElementById("blackMarketPoison")?.value || 0);
        const bmGun = parseInt(document.getElementById("blackMarketGun")?.value || 0);
        if (bmSeer && bmPoison && bmGun) {
          gameState.nightMemory.blackMarketGifts = { seer: bmSeer, poison: bmPoison, gun: bmGun };
          // 判定是否3禮物全送給好人
          const s1 = gameState.players.find(p => p.seat === bmSeer);
          const s2 = gameState.players.find(p => p.seat === bmPoison);
          const s3 = gameState.players.find(p => p.seat === bmGun);
          if (s1.seatType !== "WEREWOLF" && s2.seatType !== "WEREWOLF" && s3.seatType !== "WEREWOLF") {
            gameState.nightMemory.blackMarketTransformedWolf = true;
          }
        }
      }

      // 2. 魔術師交換映射計算
      const magA = parseInt(document.getElementById("magicianTargetA")?.value || 0);
      const magB = parseInt(document.getElementById("magicianTargetB")?.value || 0);
      const swapMap = (seat) => {
        if (!magA || !magB || !seat) return seat;
        if (seat === magA) return magB;
        if (seat === magB) return magA;
        return seat;
      };

      // 實際受技能影響之目標 (魔術師結算在後)
      let finalWolfTarget = swapMap(rawWolfTarget);
      let finalPoisonTarget = swapMap(rawPoisonTarget);
      let finalGuardTarget = swapMap(guardTarget);
      let finalDreamerTarget = swapMap(dreamerTarget);
      let finalYoungWolfTarget = swapMap(youngWolfSolo);

      let deaths = [];
      let hunterCanShoot = true;
      let wolfKingCanShoot = true;

      // 3. 狼刀與守衛/女巫同守同救奶穿判定
      if (finalWolfTarget) {
        const isGuarded = (finalGuardTarget === finalWolfTarget);
        const isSaved = antidoteUsedThisNight;

        if (isGuarded && isSaved) {
          // 同守同救奶穿死亡 (milk_through)
          deaths.push(finalWolfTarget);
        } else if (isGuarded && !isSaved) {
          // 守衛守中，平安夜
        } else if (!isGuarded && isSaved) {
          // 女巫救活，平安夜
        } else {
          // 實死
          deaths.push(finalWolfTarget);
        }
      }

      // 4. 狼弟獨立單砍 (若有)
      if (finalYoungWolfTarget && !deaths.includes(finalYoungWolfTarget)) {
        deaths.push(finalYoungWolfTarget);
      }

      // 5. 毒藥判定
      if (finalPoisonTarget) {
        if (!deaths.includes(finalPoisonTarget)) deaths.push(finalPoisonTarget);
        // 若毒到獵人或狼王，悶槍
        const poisonedPlayer = gameState.players.find(p => p.seat === finalPoisonTarget);
        if (poisonedPlayer) {
          if (poisonedPlayer.role === "獵人") hunterCanShoot = false;
          if (poisonedPlayer.role === "狼王") wolfKingCanShoot = false;
        }
      }

      // 6. 攝夢人連夢判定
      if (finalDreamerTarget) {
        if (gameState.nightMemory.dreamerLastTarget === finalDreamerTarget) {
          if (!deaths.includes(finalDreamerTarget)) deaths.push(finalDreamerTarget);
          const dreamtPlayer = gameState.players.find(p => p.seat === finalDreamerTarget);
          if (dreamtPlayer && dreamtPlayer.role === "獵人") hunterCanShoot = false;
        }
      }

      // 7. 更新記憶庫狀態
      gameState.nightMemory.guardLastTarget = guardTarget || null;
      gameState.nightMemory.dreamerLastTarget = dreamerTarget || null;
      if (antidoteUsedThisNight) gameState.nightMemory.witchAntidoteUsed = true;
      if (rawPoisonTarget) gameState.nightMemory.witchPoisonUsed = true;

      // 8. 執行死訊標記
      deaths.forEach(seat => {
        const p = gameState.players.find(x => x.seat === seat);
        if (p) p.isAlive = false;
      });

      // 9. 檢查開槍觸發 (獵人 / 狼王)
      const deadHunter = gameState.players.find(p => p.role === "獵人" && deaths.includes(p.seat));
      const deadWolfKing = gameState.players.find(p => p.role === "狼王" && deaths.includes(p.seat));

      if (deadHunter && hunterCanShoot) {
        triggerGunAction("獵人", deadHunter.seat);
      } else if (deadWolfKing && wolfKingCanShoot) {
        triggerGunAction("狼王", deadWolfKing.seat);
      }

      updateCounts();

      // 切換為白天介面
      document.getElementById("nightPanel").classList.add("hidden");
      document.getElementById("dayPanel").classList.remove("hidden");
      document.getElementById("roundBadge").innerText = `第 ${gameState.round} 天 白天`;
      
      const summaryText = deaths.length === 0 ? "昨夜平安夜" : `昨夜死訊：${deaths.map(s => s + '號').join(', ')} 出局`;
      document.getElementById("nightDeathSummary").innerText = summaryText;

      setupDayVoting();
    }

    function triggerGunAction(roleName, shooterSeat) {
      const box = document.getElementById("hunterActionBox");
      const title = document.getElementById("gunTriggerTitle");
      box.classList.remove("hidden");
      title.innerText = `${shooterSeat}號【${roleName}】出局觸發開槍技能：`;
      const alive = gameState.players.filter(p => p.isAlive);
      document.getElementById("hunterTarget").innerHTML = `<option value="">請選擇帶走對象</option>` +
        alive.map(p => `<option value="${p.seat}">${p.seat}號 - ${p.name || ''}</option>`).join('');
    }

    function applyHunterShot() {
      const targetSeat = parseInt(document.getElementById("hunterTarget").value);
      if (!targetSeat) return;
      const target = gameState.players.find(p => p.seat === targetSeat);
      target.isAlive = false;
      alert(`💥 開槍技能發動，帶走了 ${targetSeat} 號 (${target.name || ''})！`);
      document.getElementById("hunterActionBox").classList.add("hidden");
      updateCounts();
      setupDayVoting();
    }

    function setupDayVoting() {
      const alive = gameState.players.filter(p => p.isAlive);
      votesMap = {};
      currentVoteTarget = alive[0] ? alive[0].seat : null;

      const targetsContainer = document.getElementById("voteTargetsContainer");
      targetsContainer.innerHTML = alive.map(p => `
        <button onclick="setVoteTarget(${p.seat})" id="targetBtn-${p.seat}" class="py-1 px-2.5 rounded text-xs font-bold border border-gray-700 bg-gray-800 text-gray-300 transition">
          投 ${p.seat}號
        </button>
      `).join('') + `
        <button onclick="setVoteTarget(0)" id="targetBtn-0" class="py-1 px-2.5 rounded text-xs font-bold border border-gray-700 bg-gray-800 text-gray-400 transition">
          棄票
        </button>
      `;

      const votersContainer = document.getElementById("votersBadgeContainer");
      votersContainer.innerHTML = alive.map(p => `
        <button onclick="assignVote(${p.seat})" id="voterBadge-${p.seat}" class="w-11 h-9 rounded bg-gray-800 border border-gray-700 text-gray-300 text-xs font-mono font-bold flex flex-col items-center justify-center transition">
          ${p.seat}號 <span class="text-[8px] text-gray-500 font-normal">未投</span>
        </button>
      `).join('');

      if (currentVoteTarget !== null) setVoteTarget(currentVoteTarget);
    }

    function setVoteTarget(targetSeat) {
      currentVoteTarget = targetSeat;
      document.querySelectorAll("[id^='targetBtn-']").forEach(btn => {
        btn.className = "py-1 px-2.5 rounded text-xs font-bold border border-gray-700 bg-gray-800 text-gray-300 transition";
      });
      const activeBtn = document.getElementById(`targetBtn-${targetSeat}`);
      if (activeBtn) {
        activeBtn.className = "py-1 px-2.5 rounded text-xs font-bold border border-blue-500 bg-blue-950 text-blue-200 transition";
      }
    }

    function assignVote(voterSeat) {
      if (currentVoteTarget === null) return;
      if (votesMap[voterSeat] === currentVoteTarget) {
        delete votesMap[voterSeat];
      } else {
        votesMap[voterSeat] = currentVoteTarget;
      }
      renderVotes();
    }

    function renderVotes() {
      const alive = gameState.players.filter(p => p.isAlive);
      alive.forEach(p => {
        const badge = document.getElementById(`voterBadge-${p.seat}`);
        const assigned = votesMap[p.seat];
        if (assigned === undefined) {
          badge.className = "w-11 h-9 rounded bg-gray-800 border border-gray-700 text-gray-300 text-xs font-mono font-bold flex flex-col items-center justify-center transition";
          badge.innerHTML = `${p.seat}號 <span class="text-[8px] text-gray-500 font-normal">未投</span>`;
        } else if (assigned === 0) {
          badge.className = "w-11 h-9 rounded bg-gray-700 border border-gray-500 text-gray-200 text-xs font-mono font-bold flex flex-col items-center justify-center transition";
          badge.innerHTML = `${p.seat}號 <span class="text-[8px] text-gray-400 font-normal">棄票</span>`;
        } else {
          badge.className = "w-11 h-9 rounded bg-indigo-950 border border-indigo-500 text-indigo-100 text-xs font-mono font-bold flex flex-col items-center justify-center transition";
          badge.innerHTML = `${p.seat}號 <span class="text-[8px] text-amber-300 font-normal">投 ${assigned}</span>`;
        }
      });

      let tallies = {};
      Object.entries(votesMap).forEach(([voter, target]) => {
        if (!tallies[target]) tallies[target] = [];
        tallies[target].push(voter);
      });

      let summaryHtml = "";
      Object.keys(tallies).forEach(t => {
        const label = t == 0 ? "棄票" : `${t} 號 (${tallies[t].length} 票)`;
        summaryHtml += `<div><strong>${label}</strong>: ${tallies[t].map(s => s + '號').join(', ')}</div>`;
      });
      document.getElementById("voteSummaryBox").innerHTML = summaryHtml || "尚無投票記錄";
    }

    function confirmExile() {
      let tallies = {};
      Object.entries(votesMap).forEach(([voter, target]) => {
        if (target != 0) tallies[target] = (tallies[target] || 0) + 1;
      });

      let maxVotes = 0;
      let exiledSeat = null;
      Object.entries(tallies).forEach(([seat, count]) => {
        if (count > maxVotes) {
          maxVotes = count;
          exiledSeat = parseInt(seat);
        }
      });

      if (!exiledSeat) {
        alert("平票或全體棄票，無人被放逐！");
        return;
      }

      const exiledPlayer = gameState.players.find(p => p.seat === exiledSeat);
      gameState.lastExiledPlayer = exiledPlayer;

      if (exiledPlayer.role === "白痴") {
        alert(`🔔 ${exiledSeat} 號為白痴，觸發翻牌免死技能！保留發言權，拔除投票權。`);
      } else {
        exiledPlayer.isAlive = false;
        alert(`❌ ${exiledSeat} 號玩家 (${exiledPlayer.name || ''}) 被公投放逐出局！`);
        
        // 放逐開槍判定 (獵人 / 狼王)
        if (exiledPlayer.role === "獵人") {
          triggerGunAction("獵人", exiledPlayer.seat);
        } else if (exiledPlayer.role === "狼王") {
          triggerGunAction("狼王", exiledPlayer.seat);
        }
      }

      updateCounts();
    }

    function enterNextNight() {
      gameState.round += 1;
      document.getElementById("dayPanel").classList.add("hidden");
      document.getElementById("nightPanel").classList.remove("hidden");
      document.getElementById("roundBadge").innerText = `第 ${gameState.round} 夜`;
      renderNightPanel();
    }

    function backToNight() {
      document.getElementById("dayPanel").classList.add("hidden");
      document.getElementById("nightPanel").classList.remove("hidden");
      document.getElementById("roundBadge").innerText = `第 ${gameState.round} 夜`;
      renderNightPanel();
    }

    function checkGameOver(gods, villagers, wolves) {
      const statusText = document.getElementById("gameStatusText");
      const statusTextDesk = document.getElementById("gameStatusTextDesk");

      let text = "進行中";
      let className = "text-emerald-400 font-bold";

      if (wolves === 0) {
        gameState.winner = "villager";
        text = "好人陣營獲勝！(狼人全滅)";
        className = "text-blue-400 font-bold";
        alert("🎉 遊戲結束：狼人全員出局，好人陣營獲勝！");
      } else if (gods === 0) {
        gameState.winner = "werewolf";
        text = "狼人屠神獲勝！";
        className = "text-rose-400 font-bold";
        alert("🐺 遊戲結束：神職全員出局，狼人陣營屠神獲勝！");
      } else if (villagers === 0) {
        gameState.winner = "werewolf";
        text = "狼人屠民獲勝！";
        className = "text-rose-400 font-bold";
        alert("🐺 遊戲結束：民坑全員出局，狼人陣營屠民獲勝！");
      }

      if (statusText) {
        statusText.innerText = text;
        statusText.className = className;
      }
      if (statusTextDesk) {
        statusTextDesk.innerText = text;
        statusTextDesk.className = `text-sm ml-1 ${className}`;
      }
    }

    function commitMatchResults() {
      if (!gameState.winner) {
        if (!confirm("遊戲尚未判定勝負，確定要提前強制結算存檔嗎？")) return;
      }
      alert("✅ 對局結算完成！已同步寫入資料庫！");
    }

    function abandonMatch() {
      const step1 = confirm("🚨 確定要將本局判定為【流局（抄掉）】嗎？\n\n注意：此操作將直接作廢對局，且「絕不會」將任何勝負或天梯積分寫入資料庫！");
      if (!step1) return;
      const step2 = confirm("⚠️ 再次確認：真的要強制作廢並重置目前對局嗎？\n（點擊確定後對局立即清空歸零）");
      if (!step2) return;

      resetGameStateData();
      initSeats();
      alert("🛑 本局已判定作廢（流局），所有狀態已重置為初始配置，未產生任何數據紀錄。");
    }

    function resetMatch() {
      if (confirm("確定要重置目前對局嗎？所有資料將清空。")) {
        resetGameStateData();
        initSeats();
      }
    }

    function resetGameStateData() {
      gameState.round = 1;
      gameState.phase = "SETUP";
      gameState.winner = null;
      gameState.policeSeat = null;
      gameState.lastExiledPlayer = null;
      gameState.nightMemory = {
        guardLastTarget: null,
        dreamerLastTarget: null,
        nightmareLastTarget: null,
        magicianSwappedSeats: new Set(),
        witchAntidoteUsed: false,
        witchPoisonUsed: false,
        gargoyleConvertedTarget: null,
        blackMarketGifts: { seer: null, poison: null, gun: null },
        blackMarketTransformedWolf: false,
        youngWolfSoloKillUsed: false
      };
      votesMap = {};
      currentVoteTarget = null;
      antidoteUsedThisNight = false;

      document.getElementById("setupPanel").setAttribute("open", "true");
      document.getElementById("dayPanel").classList.add("hidden");
      document.getElementById("nightPanel").classList.remove("hidden");
      document.getElementById("roundBadge").innerText = "第 1 夜";
      
      const statusText = document.getElementById("gameStatusText");
      const statusTextDesk = document.getElementById("gameStatusTextDesk");
      if (statusText) {
        statusText.innerText = "進行中";
        statusText.className = "text-emerald-400 font-bold";
      }
      if (statusTextDesk) {
        statusTextDesk.innerText = "進行中";
        statusTextDesk.className = "text-sm ml-1 text-emerald-400 font-bold";
      }
    }

    window.onload = () => {
      initBoardSelector();
    };
  </script>
</body>
