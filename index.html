<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>基地狼人殺 報名櫃台</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #12151c;
      --card-bg: #1e2430;
      --accent: #e53935;
      --accent-hover: #d32f2f;
      --text-main: #f0f3f6;
      --text-sub: #9aa5b1;
      --border: #2d3748;
      --success: #38a169;
      --warning: #dd6b20;
      --gold: #ecc94b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; min-height: 100vh; padding-bottom: 70px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; letter-spacing: 1px; color: #fff; margin-bottom: 10px; }
    
    .venue-info {
      background: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
    }
    .venue-info p { margin: 2px 0; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
    .venue-highlight { color: #f6e05e; font-weight: bold; }

    .rules-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 auto 16px;
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
      color: #a0aec0;
    }
    .rules-box p { margin: 0; }
    .rules-diamond { color: #f97316; margin-right: 4px; font-size: 11px; }

    .tabs { display: flex; background: var(--card-bg); border-radius: 10px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px 0; border: none; background: transparent; color: var(--text-sub); font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #151922; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    
    .btn-submit { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-submit:active { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .edit-actions { display: none; gap: 10px; margin-top: 10px; }
    .btn-update { flex: 2; padding: 14px; background: #3182ce; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-cancel-signup { flex: 1; padding: 14px; background: #4a5568; border: none; border-radius: 8px; color: #fc8181; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-update:active { background: #2b6cb0; }
    .btn-cancel-signup:active { background: #2d3748; }

    .user-status-notice {
      display: none;
      background: rgba(49, 130, 206, 0.15);
      border: 1px solid rgba(49, 130, 206, 0.4);
      color: #90cdf4;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    
    .session-filter { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-btn { flex: 1; padding: 8px 0; border: 1px solid var(--border); background: #151922; color: var(--text-sub); border-radius: 6px; font-size: 13px; cursor: pointer; }
    .filter-btn.active { background: #2d3748; color: #fff; border-color: var(--accent); font-weight: bold; }

    .list-actions { display: flex; gap: 8px; }
    .action-btn { background: #2d3748; border: 1px solid var(--border); color: #e2e8f0; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: 0.2s; }
    .action-btn:hover { background: #4a5568; }
    .action-btn:active { transform: scale(0.96); }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .god-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(236, 201, 75, 0.12);
      border: 1px solid rgba(236, 201, 75, 0.35);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #f6e05e;
    }

    .section-divider {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #151922;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 14px 0 8px 0;
      border-left: 3px solid var(--accent);
      font-size: 13px;
      font-weight: bold;
    }
    .divider-ontime { border-left-color: #38a169; color: #68d391; }
    .divider-late { border-left-color: #dd6b20; color: #f6ad55; }
    .section-count { font-size: 12px; color: var(--text-sub); font-weight: normal; }

    .player-list { list-style: none; margin-bottom: 10px; }
    .player-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid var(--border); }
    .player-item:last-child { border-bottom: none; }
    .player-idx { font-size: 14px; font-weight: bold; color: var(--accent); width: 28px; }
    .player-info { flex: 1; }
    .player-name { font-size: 15px; font-weight: 500; }
    .player-time { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .player-badges { display: flex; gap: 4px; }
    .badge { font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: 500; }
    .badge-paid { background: rgba(56, 161, 105, 0.2); color: #48bb78; border: 1px solid rgba(56, 161, 105, 0.4); }
    .badge-unpaid { background: rgba(221, 107, 32, 0.2); color: #ed8936; border: 1px solid rgba(221, 107, 32, 0.4); }
    .badge-free { background: rgba(236, 201, 75, 0.2); color: #ecc94b; border: 1px solid rgba(236, 201, 75, 0.4); }
    .badge-checked { background: rgba(66, 153, 225, 0.2); color: #63b3ed; border: 1px solid rgba(66, 153, 225, 0.4); }
    .badge-unchecked { background: rgba(160, 174, 192, 0.15); color: #a0aec0; border: 1px solid rgba(160, 174, 192, 0.3); }
    .empty-state { text-align: center; color: var(--text-sub); padding: 24px 0; font-size: 13px; }
    .status-msg { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
    .status-msg.success { background: rgba(56, 161, 105, 0.2); color: #48bb78; display: block; }
    .status-msg.error { background: rgba(229, 57, 53, 0.2); color: #f56565; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐺 基地狼人殺</h1>
      <div class="venue-info">
        <p>📍 <strong>地點：</strong>台中市北屯區天津路三段57號</p>
        <p>💰 <strong>費用：</strong><span class="venue-highlight">入場費 $200 打到破桌</span></p>
      </div>
      <div class="rules-box">
        <p><span class="rules-diamond">◆</span>禁止情緒激動、脾氣大的人</p>
        <p><span class="rules-diamond">◆</span>禁止任何不禮貌行為</p>
        <p><span class="rules-diamond">◆</span>臨時無法參加/延後請告知主揪</p>
        <p><span class="rules-diamond">◆</span>請包容每一位玩家勿隨意批評</p>
        <p><span class="rules-diamond">◆</span>開心最重要</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabSignupBtn" onclick="switchTab('signup')">我要報名</button>
      <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">目前名單</button>
    </div>

    <div id="statusAlert" class="status-msg"></div>

    <!-- 報名分頁 -->
    <div id="signupSection">
      <div class="card">
        <div id="userStatusNotice" class="user-status-notice">
          💡 您已報名此場次，可直接在此更新時間或取消報名。
        </div>

        <form id="signupForm" onsubmit="handleFormSubmit(event)">
          <div class="form-group">
            <label>場次日期</label>
            <select id="sessionDate" onchange="checkUserSignupStatus()"></select>
          </div>

          <div class="form-group">
            <label>LINE 暱稱（系統自動偵測）</label>
            <input type="text" id="userName" placeholder="LINE 登入載入中..." required oninput="checkUserSignupStatus()">
          </div>

          <div class="form-group">
            <label>預計到場時間</label>
            <select id="arrivalTime">
              <option value="14:00" selected>14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
              <option value="20:00">20:00</option>
              <option value="21:00">21:00</option>
              <option value="22:00">22:00</option>
              <option value="23:00">23:00</option>
              <option value="00:00">00:00</option>
            </select>
          </div>

          <div class="form-group">
            <label>預計離場時間</label>
            <select id="leaveTime">
              <option value="打到底" selected>打到底</option>
              <option value="16:00 前走">16:00 前走</option>
              <option value="17:00 前走">17:00 前走</option>
              <option value="18:00 前走">18:00 前走</option>
              <option value="19:00 前走">19:00 前走</option>
              <option value="20:00 前走">20:00 前走</option>
              <option value="21:00 前走">21:00 前走</option>
              <option value="22:00 前走">22:00 前走</option>
              <option value="23:00 前走">23:00 前走</option>
              <option value="00:00 前走">00:00 前走</option>
            </select>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">確認送出報名</button>

          <div id="editActionGroup" class="edit-actions">
            <button type="button" id="updateBtn" class="btn-update" onclick="handleFormSubmit(event)">🔄 更新進/離場時間</button>
            <button type="button" id="cancelSignupBtn" class="btn-cancel-signup" onclick="handleCancelSignup()">❌ 取消報名</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 名單分頁 -->
    <div id="listSection" style="display: none;">
      <div class="card">
        <div class="session-filter" id="sessionFilterButtons"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 14px; font-weight: bold;"><span id="currentSessionLabel"></span> 玩家：<span id="playerCount" style="color: var(--accent);">0</span> 人</span>
          <div class="list-actions">
            <button class="action-btn" id="copyBtn" onclick="copyCurrentList()">📋 複製名單</button>
            <button class="action-btn" id="refreshBtn" onclick="fetchLatestPlayers(true)">🔄 刷新</button>
          </div>
        </div>

        <div id="listContainer">
          <div class="empty-state">名單載入中...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CURRENT_SESSIONS = [
      "10/3 (週六場)",
      "10/4 (週日場)"
    ];

    const LIFF_ID = "2011803898-DMDxFdXE";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz3Wae--2O_vMolZ7hXHYU-1sNRytT6K8VWQJ0O4Lc4xxuq-R-bH-PcvrNtb6arvHg/exec";

    let allPlayersData = [];
    let currentSelectedSession = CURRENT_SESSIONS[0];
    let isFetching = false;

    function isGodUser(name) {
      return (name || '').trim().toLowerCase() === 'ean';
    }

    function initSessions() {
      const selectEl = document.getElementById('sessionDate');
      const filterGroup = document.getElementById('sessionFilterButtons');
      selectEl.innerHTML = '';
      filterGroup.innerHTML = '';

      CURRENT_SESSIONS.forEach((session, idx) => {
        const opt = document.createElement('option');
        opt.value = session;
        opt.textContent = session;
        selectEl.appendChild(opt);

        const btn = document.createElement('button');
        btn.className = `filter-btn ${idx === 0 ? 'active' : ''}`;
        btn.id = `filterBtn_${idx}`;
        btn.textContent = `📅 ${session}`;
        btn.onclick = () => filterSession(session, idx);
        filterGroup.appendChild(btn);
      });

      document.getElementById('currentSessionLabel').innerText = currentSelectedSession;
    }

    window.onload = function() {
      initSessions();

      const cached = localStorage.getItem('werewolf_players_data');
      if (cached) {
        try {
          allPlayersData = JSON.parse(cached);
          renderPlayerList();
        } catch (e) {}
      }

      const cachedName = localStorage.getItem('werewolf_user_name');
      if (cachedName) {
        document.getElementById('userName').value = cachedName;
        checkUserSignupStatus();
      }

      initLiffAsync();
      fetchLatestPlayers(false);
    };

    async function initLiffAsync() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          if (profile && profile.displayName) {
            document.getElementById('userName').value = profile.displayName;
            localStorage.setItem('werewolf_user_name', profile.displayName);
            checkUserSignupStatus();
          }
        } else {
          document.getElementById('userName').placeholder = "請輸入您的稱呼";
        }
      } catch (err) {
        document.getElementById('userName').placeholder = "請輸入您的稱呼";
      }
    }

    function switchTab(tab) {
      if (tab === 'signup') {
        document.getElementById('signupSection').style.display = 'block';
        document.getElementById('listSection').style.display = 'none';
        document.getElementById('tabSignupBtn').classList.add('active');
        document.getElementById('tabListBtn').classList.remove('active');
        checkUserSignupStatus();
      } else {
        document.getElementById('signupSection').style.display = 'none';
        document.getElementById('listSection').style.display = 'block';
        document.getElementById('tabSignupBtn').classList.remove('active');
        document.getElementById('tabListBtn').classList.add('active');
        renderPlayerList();
      }
    }

    function filterSession(session, activeIndex) {
      currentSelectedSession = session;
      document.getElementById('currentSessionLabel').innerText = session;
      
      CURRENT_SESSIONS.forEach((_, idx) => {
        const btn = document.getElementById(`filterBtn_${idx}`);
        if (btn) btn.classList.toggle('active', idx === activeIndex);
      });

      renderPlayerList();
    }

    function checkUserSignupStatus() {
      const name = document.getElementById('userName').value.trim();
      const session = document.getElementById('sessionDate').value;
      const submitBtn = document.getElementById('submitBtn');
      const editGroup = document.getElementById('editActionGroup');
      const noticeBox = document.getElementById('userStatusNotice');

      if (!name) return;

      const myRecordKey = `my_signup_${name}_${session}`;
      const localMyRecord = localStorage.getItem(myRecordKey);

      let record = null;
      if (localMyRecord) {
        try { record = JSON.parse(localMyRecord); } catch(e) {}
      }

      if (!record && allPlayersData.length > 0) {
        record = allPlayersData.find(p => 
          (p['場次日期'] || '').trim() === session.trim() && 
          (p['LINE暱稱'] || '').trim().toLowerCase() === name.toLowerCase()
        );
      }

      if (record) {
        const arrivalVal = (record['到場時間'] || '').replace('準時 ', '');
        const leaveVal = record['離場時間'] || '打到底';

        document.getElementById('arrivalTime').value = arrivalVal;
        document.getElementById('leaveTime').value = leaveVal;

        submitBtn.style.display = 'none';
        editGroup.style.display = 'flex';
        noticeBox.style.display = 'block';
      } else {
        submitBtn.style.display = 'block';
        editGroup.style.display = 'none';
        noticeBox.style.display = 'none';
      }
    }

    async function handleFormSubmit(e) {
      if (e) e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const updateBtn = document.getElementById('updateBtn');
      const cancelBtn = document.getElementById('cancelSignupBtn');
      const alertBox = document.getElementById('statusAlert');
      const session = document.getElementById('sessionDate').value;
      const name = document.getElementById('userName').value.trim();
      const arrival = document.getElementById('arrivalTime').value;
      const leave = document.getElementById('leaveTime').value;

      if (!name) {
        alert("請輸入暱稱！");
        return;
      }

      submitBtn.disabled = true;
      updateBtn.disabled = true;
      cancelBtn.disabled = true;
      updateBtn.innerText = "更新中...";
      submitBtn.innerText = "送出中...";
      alertBox.className = "status-msg";
      alertBox.style.display = "none";

      localStorage.setItem(`my_signup_${name}_${session}`, JSON.stringify({
        '到場時間': arrival,
        '離場時間': leave
      }));

      const existingIdx = allPlayersData.findIndex(p => 
        (p['場次日期'] || '').trim() === session.trim() && 
        (p['LINE暱稱'] || '').trim().toLowerCase() === name.toLowerCase()
      );

      if (existingIdx >= 0) {
        allPlayersData[existingIdx]['到場時間'] = arrival;
        allPlayersData[existingIdx]['離場時間'] = leave;
      } else {
        allPlayersData.push({
          '場次日期': session,
          'LINE暱稱': name,
          '到場時間': arrival,
          '離場時間': leave,
          '簽到狀態': '未簽到',
          '收款狀態': isGodUser(name) ? '免收費' : '未付款'
        });
      }
      localStorage.setItem('werewolf_players_data', JSON.stringify(allPlayersData));

      alertBox.innerText = `🎉 已成功送出【${session}】的登記！`;
      alertBox.className = "status-msg success";
      
      const sessionIdx = CURRENT_SESSIONS.indexOf(session);
      filterSession(session, sessionIdx !== -1 ? sessionIdx : 0);
      switchTab('list');
      submitBtn.disabled = false;
      updateBtn.disabled = false;
      cancelBtn.disabled = false;
      submitBtn.innerText = "確認送出報名";
      updateBtn.innerText = "🔄 更新進/離場時間";

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: "submit",
            sessionDate: session,
            userName: name,
            arrivalTime: arrival,
            leaveTime: leave
          })
        });
      } catch (err) {}
    }

    async function handleCancelSignup() {
      const session = document.getElementById('sessionDate').value;
      const name = document.getElementById('userName').value.trim();
      const cancelBtn = document.getElementById('cancelSignupBtn');
      const updateBtn = document.getElementById('updateBtn');
      const alertBox = document.getElementById('statusAlert');

      const isConfirmed = confirm(`⚠ 確定要取消【${session}】的報名嗎？\n名額將自動釋出。`);
      if (!isConfirmed) return;

      cancelBtn.disabled = true;
      updateBtn.disabled = true;
      cancelBtn.innerText = "取消中...";

      localStorage.removeItem(`my_signup_${name}_${session}`);

      allPlayersData = allPlayersData.filter(p => 
        !((p['場次日期'] || '').trim() === session.trim() && 
          (p['LINE暱稱'] || '').trim().toLowerCase() === name.toLowerCase())
      );
      localStorage.setItem('werewolf_players_data', JSON.stringify(allPlayersData));

      alertBox.innerText = `✅ 已成功取消【${session}】的報名！`;
      alertBox.className = "status-msg success";

      checkUserSignupStatus();
      const sessionIdx = CURRENT_SESSIONS.indexOf(session);
      filterSession(session, sessionIdx !== -1 ? sessionIdx : 0);
      switchTab('list');
      cancelBtn.disabled = false;
      updateBtn.disabled = false;
      cancelBtn.innerText = "❌ 取消報名";

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: "cancel",
            sessionDate: session,
            userName: name
          })
        });
      } catch (err) {}
    }

    // ⚡ 靜默背景刷新：名單永不清空，按鈕給予即時回饋
    async function fetchLatestPlayers(isManual = false) {
      if (isFetching) return;
      isFetching = true;

      const refreshBtn = document.getElementById('refreshBtn');
      if (isManual && refreshBtn) {
        refreshBtn.innerText = "⏳ 同步中...";
        refreshBtn.disabled = true;
      }

      // 如果從來沒有任何快取資料，才顯示載入中
      if (allPlayersData.length === 0) {
        document.getElementById('listContainer').innerHTML = '<div class="empty-state">名單載入中...</div>';
      }

      try {
        // 加 timestamp 防止 HTTP 快取阻止獲取最新名單
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}`);
        const result = await res.json();
        
        if (result.status === "success") {
          allPlayersData = result.data || [];
          localStorage.setItem('werewolf_players_data', JSON.stringify(allPlayersData));
          renderPlayerList();
          checkUserSignupStatus();
          
          if (isManual && refreshBtn) {
            refreshBtn.innerText = "✅ 已是最新";
            setTimeout(() => {
              refreshBtn.innerText = "🔄 刷新";
              refreshBtn.disabled = false;
            }, 1000);
          }
        }
      } catch (err) {
        if (isManual && refreshBtn) {
          refreshBtn.innerText = "⚠️️ 重試";
          setTimeout(() => {
            refreshBtn.innerText = "🔄 刷新";
            refreshBtn.disabled = false;
          }, 1500);
        }
      } finally {
        isFetching = false;
        if (!isManual && refreshBtn) {
          refreshBtn.innerText = "🔄 刷新";
          refreshBtn.disabled = false;
        }
      }
    }

    function getTimeWeight(timeStr) {
      if (!timeStr) return 999;
      if (timeStr.includes("14:00")) return 14;
      if (timeStr.includes("00:00") || timeStr.includes("24:00")) return 24;
      const match = timeStr.match(/(\d{1,2}):\d{2}/);
      if (match) return parseInt(match[1], 10);
      return 999;
    }

    function renderPlayerList() {
      const containerEl = document.getElementById('listContainer');
      const countEl = document.getElementById('playerCount');
      
      const sessionRecords = allPlayersData.filter(p => (p['場次日期'] || '') === currentSelectedSession);
      const godUser = sessionRecords.find(p => isGodUser(p['LINE暱稱']));
      const actualPlayers = sessionRecords.filter(p => !isGodUser(p['LINE暱稱']));

      countEl.innerText = actualPlayers.length;

      if (actualPlayers.length === 0 && !godUser) {
        containerEl.innerHTML = `<div class="empty-state">目前【${currentSelectedSession}】尚無人報名，搶先當 1 號位！</div>`;
        return;
      }

      const sorted = [...actualPlayers].sort((a, b) => getTimeWeight(a['到場時間']) - getTimeWeight(b['到場時間']));
      const onTimePlayers = sorted.filter(p => (p['到場時間'] || '').includes('14:00'));
      const latePlayers = sorted.filter(p => !(p['到場時間'] || '').includes('14:00'));

      let html = '';

      if (godUser) {
        const checkBadge = (godUser['簽到狀態'] === '已簽到') 
          ? `<span class="badge badge-checked">已到場</span>` 
          : `<span class="badge badge-unchecked">未到場</span>`;
        html += `
          <div class="god-banner">
            <div><strong>👑 場主 / 法官：</strong>${escapeHtml(godUser['LINE暱稱'])} <span style="font-size:11px; opacity:0.8;">(🕒 ${godUser['到場時間'] || '14:00'})</span></div>
            <div class="player-badges">
              ${checkBadge}
              <span class="badge badge-free">免收費</span>
            </div>
          </div>
        `;
      }

      html += `
        <div class="section-divider divider-ontime">
          <span>🟢 14:00</span>
          <span class="section-count">${onTimePlayers.length} 人</span>
        </div>
      `;
      if (onTimePlayers.length > 0) {
        html += '<ul class="player-list">';
        onTimePlayers.forEach((p, idx) => {
          html += renderPlayerItem(p, idx + 1);
        });
        html += '</ul>';
      } else {
        html += '<div class="empty-state" style="padding: 12px 0;">尚無 14:00 玩家</div>';
      }

      html += `
        <div class="section-divider divider-late">
          <span>🟡 晚到</span>
          <span class="section-count">${latePlayers.length} 人</span>
        </div>
      `;
      if (latePlayers.length > 0) {
        html += '<ul class="player-list">';
        latePlayers.forEach((p, idx) => {
          html += renderPlayerItem(p, onTimePlayers.length + idx + 1);
        });
        html += '</ul>';
      } else {
        html += '<div class="empty-state" style="padding: 12px 0;">無晚到玩家</div>';
      }

      containerEl.innerHTML = html;
    }

    function renderPlayerItem(p, displayIdx) {
      const checkBadge = (p['簽到狀態'] === '已簽到') 
        ? `<span class="badge badge-checked">已簽到</span>` 
        : `<span class="badge badge-unchecked">未簽到</span>`;
      const payBadge = (p['收款狀態'] === '已付款') 
        ? `<span class="badge badge-paid">已付款</span>` 
        : `<span class="badge badge-unpaid">未付款</span>`;

      const displayArrivalTime = (p['到場時間'] || '-').replace('準時 ', '');

      return `
        <li class="player-item">
          <div class="player-idx">${displayIdx}</div>
          <div class="player-info">
            <div class="player-name">${escapeHtml(p['LINE暱稱'] || '匿名玩家')}</div>
            <div class="player-time">🕒 ${escapeHtml(displayArrivalTime)} ｜ 🏃 ${escapeHtml(p['離場時間'] || '-')}</div>
          </div>
          <div class="player-badges">
            ${checkBadge}
            ${payBadge}
          </div>
        </li>
      `;
    }

    function copyCurrentList() {
      const sessionRecords = allPlayersData.filter(p => (p['場次日期'] || '') === currentSelectedSession);
      const godUser = sessionRecords.find(p => isGodUser(p['LINE暱稱']));
      const actualPlayers = sessionRecords.filter(p => !isGodUser(p['LINE暱稱']));

      if (actualPlayers.length === 0 && !godUser) {
        alert(`目前【${currentSelectedSession}】尚無報名人員！`);
        return;
      }

      const sorted = [...actualPlayers].sort((a, b) => getTimeWeight(a['到場時間']) - getTimeWeight(b['到場時間']));
      const onTimePlayers = sorted.filter(p => (p['到場時間'] || '').includes('14:00'));
      const latePlayers = sorted.filter(p => !(p['到場時間'] || '').includes('14:00'));

      let text = `🐺 基地狼人殺 ${currentSelectedSession}\n`;
      text += `📍 天津路三段57號｜💰 $200打到破桌\n`;
      if (godUser) {
        text += `👑 法官：${godUser['LINE暱稱']}\n`;
      }
      text += `────────────────\n`;
      
      text += `🟢 14:00 (${onTimePlayers.length}人)\n`;
      if (onTimePlayers.length > 0) {
        onTimePlayers.forEach((p, idx) => {
          const leave = (p['離場時間'] && p['離場時間'] !== '打到底') ? ` (🏃${p['離場時間']})` : '';
          text += `${idx + 1}. ${p['LINE暱稱']}${leave}\n`;
        });
      } else {
        text += `(尚無)\n`;
      }

      if (latePlayers.length > 0) {
        text += `\n🟡 晚到 (${latePlayers.length}人)\n`;
        latePlayers.forEach((p, idx) => {
          const arrival = (p['到場時間'] || '').replace('準時 ', '');
          const leave = (p['離場時間'] && p['離場時間'] !== '打到底') ? `~${p['離場時間']}` : '';
          text += `${onTimePlayers.length + idx + 1}. ${p['LINE暱稱']} ${arrival}${leave}\n`;
        });
      }

      text += `────────────────\n`;
      const needed14 = 10 - onTimePlayers.length;
      const statusNote = (needed14 > 0) ? `14:00 缺 ${needed14} 人開局` : `14:00 已成局！`;
      text += `📊 玩家共 ${actualPlayers.length} 人 (${statusNote})\n`;
      text += `👉 報名：https://liff.line.me/2011803898-DMDxFdXE`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showCopySuccess).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showCopySuccess();
      } catch (err) {
        alert("複製失敗，請手動複製！");
      }
      document.body.removeChild(textArea);
    }

    function showCopySuccess() {
      const copyBtn = document.getElementById('copyBtn');
      const originalText = copyBtn.innerHTML;
      copyBtn.innerHTML = "✅ 已複製！";
      copyBtn.style.background = "#2b6cb0";
      setTimeout(() => {
        copyBtn.innerHTML = originalText;
        copyBtn.style.background = "#2d3748";
      }, 1500);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
