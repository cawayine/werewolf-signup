<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基地狼人殺 - 官方入口系統</title>

  <!-- 強制瀏覽器不使用快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 繽紛霓虹卡片樣式 */
    .theme-card {
      position: relative;
      border-radius: 1rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .theme-card:active {
      transform: scale(0.985);
    }

    /* 1. 會員卡片 - 炫彩霓虹紫 */
    .card-purple {
      background: linear-gradient(135deg, rgba(88, 28, 135, 0.25) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(168, 85, 247, 0.45);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.12);
    }
    .card-purple:hover {
      border-color: #c084fc;
      box-shadow: 0 6px 24px rgba(168, 85, 247, 0.28);
    }

    /* 2. 報名處 - 極光翡翠綠 */
    .card-emerald {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.12);
    }
    .card-emerald:hover {
      border-color: #34d399;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.28);
    }

    /* 3. 天梯總榜 - 榮耀琥珀金 */
    .card-amber {
      background: linear-gradient(135deg, rgba(120, 53, 15, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.12);
    }
    .card-amber:hover {
      border-color: #fbbf24;
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.28);
    }

    /* 4. 個人戰績 - 星際深邃藍 */
    .card-blue {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(59, 130, 246, 0.45);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12);
    }
    .card-blue:hover {
      border-color: #60a5fa;
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.28);
    }

    /* 5. 現場公播 - 實況熱血玫紅 */
    .card-rose {
      background: linear-gradient(135deg, rgba(136, 19, 55, 0.28) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(244, 63, 94, 0.45);
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.12);
    }
    .card-rose:hover {
      border-color: #fb7185;
      box-shadow: 0 6px 24px rgba(244, 63, 94, 0.28);
    }

    /* 6. 上帝後台 - 暗金奢華 */
    .card-gold {
      background: linear-gradient(135deg, rgba(69, 26, 3, 0.4) 0%, rgba(17, 24, 39, 0.95) 100%);
      border: 1px solid rgba(217, 119, 6, 0.6);
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.15);
    }
    .card-gold:hover {
      border-color: #f59e0b;
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- 頂部品牌形象 -->
  <header class="text-center pt-5 pb-3">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-900 via-purple-950 to-gray-950 border border-purple-500/50 shadow-xl mb-3">
      <i class="fa-solid fa-moon text-2xl text-purple-300"></i>
    </div>
    <h1 class="text-2xl font-black tracking-wider text-gray-100 flex items-center justify-center gap-2">
      基地狼人殺 <span class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded font-mono font-bold">BASE</span>
    </h1>
    <p class="text-xs text-gray-400 mt-1 font-medium">目標成為台中最好玩的狼人殺</p>
  </header>

  <!-- 繽紛核心功能按鈕區塊 -->
  <main class="space-y-3 flex-1 flex flex-col justify-center py-1">
    
    <!-- 1. 會員綁定 - 霓虹紫 -->
    <div onclick="checkAndOpenRegisterModal()" class="theme-card card-purple p-3.5 flex items-center cursor-pointer group">
      <div class="w-11 h-11 rounded-xl bg-purple-900/60 border border-purple-400/50 flex items-center justify-center text-purple-300 text-lg mr-3 shadow-inner group-hover:scale-105 transition">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm font-bold text-purple-100 flex items-center gap-1.5">
          一鍵建立會員資料 <span class="text-[9px] bg-purple-950 text-purple-300 border border-purple-700 px-1.5 py-0.2 rounded font-mono">FAST</span>
        </div>
        <div class="text-[11px] text-purple-200/60" id="regCardDesc">未報名過？點此 3 秒綁定個人檔案與戰績庫</div>
      </div>
      <i class="fa-solid fa-chevron-right text-purple-400/50 text-xs group-hover:translate-x-1 group-hover:text-purple-300 transition"></i>
    </div>

    <!-- 2. 活動報名處 - 極光綠 -->
    <a href="signup.html" class="theme-card card-emerald p-3.5 flex items-center group">
      <div class="w-11 h-11 rounded-xl bg-emerald-900/60 border border-emerald-400/50 flex items-center justify-center text-emerald-300 text-lg mr-3 shadow-inner group-hover:scale-105 transition">
        <i class="fa-solid fa-calendar-check"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm font-bold text-emerald-100 group-hover:text-emerald-300 transition">活動報名處</div>
        <div class="text-[11px] text-emerald-200/60">查看每週場次、即時登記開局</div>
      </div>
      <i class="fa-solid fa-chevron-right text-emerald-400/50 text-xs group-hover:translate-x-1 group-hover:text-emerald-300 transition"></i>
    </a>

    <!-- 3. 天梯總榜 - 榮耀琥珀金 -->
    <div onclick="showUpcomingAlert('天梯總榜')" class="theme-card card-amber p-3.5 flex items-center cursor-pointer group">
      <div class="w-11 h-11 rounded-xl bg-amber-950/70 border border-amber-500/50 flex items-center justify-center text-amber-300 text-lg mr-3 shadow-inner group-hover:scale-105 transition">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm font-bold text-amber-100 flex items-center gap-1.5">
          天梯總榜 <span class="text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.2 rounded border border-amber-800">即將開放</span>
        </div>
        <div class="text-[11px] text-amber-200/60">賽季勝率、MVP與積分排行榜</div>
      </div>
      <i class="fa-solid fa-lock text-amber-400/50 text-xs group-hover:text-amber-300 transition"></i>
    </div>

    <!-- 4. 個人資訊 - 星際藍 -->
    <a href="profile.html" class="theme-card card-blue p-3.5 flex items-center group">
      <div class="w-11 h-11 rounded-xl bg-blue-900/60 border border-blue-400/50 flex items-center justify-center text-blue-300 text-lg mr-3 shadow-inner group-hover:scale-105 transition">
        <i class="fa-solid fa-id-card"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm font-bold text-blue-100 group-hover:text-blue-300 transition">個人戰績資訊</div>
        <div class="text-[11px] text-blue-200/60">查看歷史參賽次數、勝率與勝場徽章</div>
      </div>
      <i class="fa-solid fa-chevron-right text-blue-400/50 text-xs group-hover:translate-x-1 group-hover:text-blue-300 transition"></i>
    </a>

    <!-- 5. 公播看板 - 實況玫紅 -->
    <a href="board.html" class="theme-card card-rose p-3.5 flex items-center group">
      <div class="w-11 h-11 rounded-xl bg-rose-900/60 border border-rose-400/50 flex items-center justify-center text-rose-300 text-lg mr-3 shadow-inner group-hover:scale-105 transition">
        <i class="fa-solid fa-display"></i>
      </div>
      <div class="flex-1">
        <div class="text-sm font-bold text-rose-100 group-hover:text-rose-300 transition">現場公播看板</div>
        <div class="text-[11px] text-rose-200/60">全場席位存活、警上警下與即時開票票型</div>
      </div>
      <i class="fa-solid fa-chevron-right text-rose-400/50 text-xs group-hover:translate-x-1 group-hover:text-rose-300 transition"></i>
    </a>

  </main>

  <!-- 底部：法官 (上帝) 後台專屬登入口 -->
  <footer class="pt-3 pb-2">
    <div class="border-t border-gray-800/80 pt-3">
      <button type="button" onclick="openJudgeLogin(event)" class="w-full p-3.5 rounded-xl theme-card card-gold flex items-center justify-between text-left transition group">
        <div class="flex items-center">
          <div class="w-10 h-10 rounded-xl bg-amber-950/80 border border-amber-500/60 flex items-center justify-center text-amber-300 mr-3 shadow-inner">
            <i class="fa-solid fa-gavel"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-amber-200 flex items-center gap-1.5">
              法官專屬後台 (上帝主控台)
              <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-700 px-1.5 py-0.2 rounded font-mono">STAFF</span>
            </div>
            <div class="text-[10px] text-amber-200/60 mt-0.5">板型選擇、夜間主持引導與對局記分結算</div>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right-to-bracket text-amber-400 text-xs group-hover:translate-x-1 transition"></i>
      </button>
      <div class="text-center text-[10px] text-gray-600 mt-2 font-mono">
        BASE WEREWOLF SYSTEM © 2026
      </div>
    </div>
  </footer>

  <!-- 彈窗：一鍵建立會員 Modal -->
  <div id="quickRegisterModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-purple-500/50 rounded-2xl max-w-sm w-full p-4 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-gray-800">
        <h3 class="text-sm font-bold text-purple-300 flex items-center gap-2">
          <i class="fa-solid fa-sparkles text-purple-400"></i> 建立基地專屬會員檔案
        </h3>
        <button onclick="closeQuickRegisterModal()" class="text-gray-400 hover:text-white text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">玩家稱呼 / 暱稱：</label>
          <input type="text" id="regNameInput" placeholder="請輸入平常開團稱呼" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white font-bold outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="block text-gray-400 mb-1">玩家性別：</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectGender('M')" id="genderBtnM" class="p-2 rounded-lg border border-blue-500 bg-blue-950/60 text-blue-300 font-bold transition">
              男生 (男)
            </button>
            <button type="button" onclick="selectGender('F')" id="genderBtnF" class="p-2 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 font-bold transition">
              女生 (女)
            </button>
          </div>
        </div>

        <div class="text-[11px] text-gray-400 bg-gray-950/80 p-2.5 rounded-lg border border-gray-800">
          💡 提示：建立後將綁定此 LINE 帳號，獲得初始天梯積分 1000 分並自動累計勝率！
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="closeQuickRegisterModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-lg text-xs font-bold transition">
          取消
        </button>
        <button onclick="submitQuickRegister()" id="submitRegBtn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-lg text-xs font-bold shadow-lg transition">
          立即建立檔案
        </button>
      </div>
    </div>
  </div>

  <script>
    const MEMBER_GAS_URL = "https://script.google.com/macros/s/AKfycbzkw2ALKbEmErYZPXzn5yqzFZcx7tI_6dL4zEDouYAj5_mylskzA8mNsG-jlzaH1Vmtdg/exec";
    const LIFF_ID = "2011803898-ens7pU3H";

    let currentGender = "M";
    let currentUserProfile = null;

    // 頁面載入時嘗試靜態初始化
    window.onload = async () => {
      await ensureLiffInit();
    };

    // 封裝健壯的 LIFF 初始化函式
    async function ensureLiffInit() {
      if (currentUserProfile) return currentUserProfile;
      if (typeof liff === 'undefined') {
        console.warn("LIFF SDK 尚未載入");
        return null;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          currentUserProfile = await liff.getProfile();
          return currentUserProfile;
        }
      } catch (err) {
        console.error("LIFF 初始化異常:", err);
      }
      return null;
    }

    function showUpcomingAlert(featureName) {
      alert(`【${featureName}】正在建置中，第一賽季即將正式開放結算！`);
    }

    function openJudgeLogin(e) {
      if (e) e.preventDefault();
      const pwd = prompt("請輸入法官管理密碼：", "");
      if (pwd === null) return;

      if (pwd.trim() === "3q9527") {
        sessionStorage.setItem("judge_auth", "authorized_3q9527");
        window.location.href = "judge.html";
      } else {
        alert("❌ 密碼錯誤，僅限工作人員進入！");
      }
    }

    // 核心邏輯：點擊一鍵建立會員
    async function checkAndOpenRegisterModal() {
      const descEl = document.getElementById("regCardDesc");
      const originalText = descEl.innerText;
      descEl.innerText = "⏳ 正在驗證 LINE 身分...";

      // 1. 保證初始化與登入
      let profile = await ensureLiffInit();
      if (!profile) {
        if (typeof liff !== 'undefined') {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          try {
            profile = await liff.getProfile();
            currentUserProfile = profile;
          } catch (e) {
            console.error("取得 Profile 失敗", e);
          }
        }
      }

      if (!profile || !profile.userId) {
        descEl.innerText = originalText;
        alert("⚠️ 無法取得您的 LINE 身分識別！請確認本頁面是透過 LINE 點擊開啟。");
        return;
      }

      const uid = profile.userId;
      descEl.innerText = "🔍 正在核對資料庫會員狀態...";

      // 2. 查重：比對 GAS 資料庫
      try {
        const checkUrl = `${MEMBER_GAS_URL}?action=getMember&uid=${encodeURIComponent(uid)}`;
        const res = await fetch(checkUrl);
        const checkData = await res.json();

        if (checkData.success && checkData.member) {
          const registeredName = checkData.member["LINE暱稱"] || checkData.member["自訂暱稱"] || profile.displayName || "會員";
          alert(`⚠️ 您已經是基地會員囉！\n目前登記暱稱：【${registeredName}】\n無須重複建立，可直接報名或查看個人戰績！`);
          descEl.innerText = `✅ 已綁定會員：${registeredName}`;
          return;
        }
      } catch (err) {
        console.error("查詢會員錯誤:", err);
      } finally {
        if (!descEl.innerText.startsWith("✅")) {
          descEl.innerText = originalText;
        }
      }

      // 3. 資料庫中無此會員，打開彈窗
      document.getElementById("regNameInput").value = profile.displayName || "";
      selectGender("M");
      document.getElementById("quickRegisterModal").classList.remove("hidden");
    }

    function closeQuickRegisterModal() {
      document.getElementById("quickRegisterModal").classList.add("hidden");
    }

    function selectGender(g) {
      currentGender = g;
      const btnM = document.getElementById("genderBtnM");
      const btnF = document.getElementById("genderBtnF");
      if (g === "M") {
        btnM.className = "p-2 rounded-lg border border-blue-500 bg-blue-950/60 text-blue-300 font-bold transition";
        btnF.className = "p-2 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 font-bold transition";
      } else {
        btnM.className = "p-2 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 font-bold transition";
        btnF.className = "p-2 rounded-lg border border-rose-500 bg-rose-950/60 text-rose-300 font-bold transition";
      }
    }

    // 送出註冊
    async function submitQuickRegister() {
      const name = document.getElementById("regNameInput").value.trim();
      if (!name) {
        alert("請輸入您的稱呼/暱稱！");
        return;
      }

      if (!currentUserProfile || !currentUserProfile.userId) {
        alert("❌ 找不到 LINE UID，無法建立！");
        return;
      }

      const uid = currentUserProfile.userId;
      const submitBtn = document.getElementById("submitRegBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "建立存檔中...";

      try {
        const payload = {
          action: "upsertMember",
          uid: uid,
          lineName: name,
          customNick: name,
          gender: currentGender === "M" ? "男" : "女"
        };

        const res = await fetch(MEMBER_GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert(`🎉 恭喜【${name}】會員建立成功！已分配初始天梯積分 1000 分。`);
          closeQuickRegisterModal();
          document.getElementById("regCardDesc").innerText = `✅ 已綁定會員：${name}`;
        } else {
          alert("建立失敗：" + (result.message || "請稍候再試"));
        }
      } catch (err) {
        console.error(err);
        alert("連線後端逾時，請檢查網路連線！");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "立即建立檔案";
      }
    }
  </script>
</body>
</html>
