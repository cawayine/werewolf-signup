<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基地狼人殺 - 現場公播看板</title>

  <!-- 強制瀏覽器不使用快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase 官方 SDK (Compat 模式) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- 引入規則大腦與獨立設定檔 -->
  <script src="rules_config.js?v=20261017_patch_v8"></script>

  <style>
    body { background-color: #0b0f17; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .neon-border { border: 1px solid #30363d; }

    /* 存活與出局樣式分流 */
    .seat-alive {
      border: 1px solid #374151;
      background-color: #1f2937;
      color: #f3f4f6;
    }
    .seat-police {
      border: 1px solid #f59e0b;
      background-color: rgba(120, 53, 15, 0.4);
      color: #fde047;
    }
    .seat-night-dead {
      border: 1px solid #7c3aed;
      background-color: rgba(76, 29, 149, 0.25);
      color: #c4b5fd;
    }
    .seat-exile-dead {
      border: 1px solid #dc2626;
      background-color: rgba(127, 29, 29, 0.3);
      color: #fca5a5;
    }
    .seat-skill-dead {
      border: 1px solid #f97316;
      background-color: rgba(194, 65, 12, 0.25);
      color: #fdba74;
    }
    .seat-explode-dead {
      border: 1px solid #ef4444;
      background-color: rgba(153, 27, 27, 0.35);
      color: #fca5a5;
    }

    /* 樂透彩球專屬立體視覺 */
    .lotto-ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      box-shadow: inset -2px -3px 6px rgba(0, 0, 0, 0.45), inset 2px 2px 5px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0,0,0,0.5);
      position: relative;
      flex-shrink: 0;
    }
    .lotto-ball-lg {
      width: 46px;
      height: 46px;
      font-size: 20px;
    }
    .ball-target {
      background: radial-gradient(circle at 35% 35%, #f59e0b, #b45309);
      border: 1px solid #fbbf24;
    }
    .ball-voter {
      background: radial-gradient(circle at 35% 35%, #3b82f6, #1d4ed8);
      border: 1px solid #60a5fa;
    }
    .ball-police-voter {
      background: radial-gradient(circle at 35% 35%, #ec4899, #be185d);
      border: 2px solid #fde047;
      box-shadow: inset -2px -3px 6px rgba(0, 0, 0, 0.45), inset 2px 2px 5px rgba(255, 255, 255, 0.4), 0 0 10px rgba(234, 179, 8, 0.6);
    }
    .ball-abstain {
      background: radial-gradient(circle at 35% 35%, #6b7280, #374151);
      border: 1px solid #9ca3af;
    }
  </style>
</head>
<body class="p-3 max-w-xl lg:max-w-6xl mx-auto pb-16">

  <!-- 頂部即時公播狀態列 -->
  <header class="flex justify-between items-center py-2.5 px-3 bg-gray-900 rounded-xl neon-border mb-3 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-900/60 border border-indigo-500/50 flex items-center justify-center text-indigo-400">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h1 class="text-sm lg:text-base font-black text-gray-100 flex items-center gap-1.5">
          基地狼人殺 - 現場公播看板
          <span id="syncStatusBadge" class="bg-indigo-950 text-indigo-300 border border-indigo-800 text-[10px] px-1.5 py-0.2 rounded font-bold">連線中...</span>
        </h1>
        <span class="text-[11px] lg:text-xs text-amber-300 font-mono font-bold" id="currentStageText">等待上帝端開局...</span>
      </div>
    </div>
    <div class="text-right">
      <div class="text-[10px] text-gray-400">存活狀態</div>
      <div class="text-sm font-bold text-emerald-400 font-mono" id="aliveRatioText">-- / 12 人</div>
    </div>
  </header>

  <!-- 歷史投票輪次切換頁籤 (僅本機視圖切換，不更動雲端) -->
  <nav class="flex gap-1.5 overflow-x-auto pb-2 mb-3 text-xs scrollbar-none" id="historyTabContainer">
  </nav>

  <!-- 主公播展示區 -->
  <main class="space-y-3">
    
    <!-- 階段 A：警長競選專屬面板 -->
    <section id="policeSection" class="space-y-3 hidden">
      <!-- 警上候選人區 -->
      <div class="bg-gray-900 rounded-xl neon-border p-3 border-amber-500/40">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
            <i class="fa-solid fa-crown text-amber-400"></i> 🔥 警上競選區 (候選人與狀態)
          </span>
          <span class="text-[10px] text-gray-400" id="candidateCountLabel">0 人上警</span>
        </div>
        <div class="grid grid-cols-6 lg:grid-cols-12 gap-1.5" id="candidatesGrid"></div>
      </div>

      <!-- 警下投票區 -->
      <div class="bg-gray-900 rounded-xl neon-border p-3 border-blue-500/40">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-blue-400 flex items-center gap-1.5">
            <i class="fa-solid fa-check-to-slot text-blue-400"></i> 🛡️ 具備投票權選民區
          </span>
          <span class="text-[10px] text-gray-400" id="votersCountLabel">12 人在警下</span>
        </div>
        <div class="grid grid-cols-6 lg:grid-cols-12 gap-1.5" id="votersGrid"></div>
      </div>
    </section>

    <!-- 階段 B：席位即時存活點陣 (純資訊黑盒：只顯示席位與死因標籤，無身分外洩) -->
    <section id="seatStatusSection">
      <div class="bg-gray-900 rounded-xl neon-border p-3">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
            <i class="fa-solid fa-users"></i> 全場席位存活狀態
          </span>
          <span class="text-[10px] text-amber-400 font-bold" id="badgeHolderLabel">警長：未指定</span>
        </div>
        <div class="grid grid-cols-6 lg:grid-cols-12 gap-1.5" id="standardSeatsGrid"></div>
      </div>
    </section>

    <!-- 核心重點：當前選定輪次的「樂透彩球票型看板」 -->
    <section class="bg-gray-900 rounded-xl neon-border p-3">
      <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-gray-800">
        <span class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
          <i class="fa-solid fa-square-poll-vertical text-amber-400"></i>
          <span id="voteSummaryTitle">票型開票結果</span>
        </span>
        <span id="voteSummaryBadge" class="text-xs bg-gray-800 text-gray-400 px-2 py-0.5 rounded font-bold">
          等待計票
        </span>
      </div>

      <!-- 樂透彩球票型清單 -->
      <div id="lottoVotesContainer" class="space-y-2.5">
        <div class="text-gray-500 text-xs text-center py-8">等待上帝端輸入投票票型</div>
      </div>
    </section>
  </main>

  <script>
    // Firebase 配置 (與上帝端連線相同節點)
    const firebaseConfig = {
      apiKey: "AIzaSyD-IcZrJUj4pXYxe9ZXNxU5o5A1koSwxbc",
      authDomain: "werewolf-base.firebaseapp.com",
      databaseURL: "https://werewolf-base-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "werewolf-base",
      storageBucket: "werewolf-base.firebasestorage.app",
      messagingSenderId: "1044529133849",
      appId: "1:1044529133849:web:b79bf341b1296971252d88"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const matchRef = db.ref("currentMatch");

    // 核心資料狀態 (純受體模式)
    let gameState = RULES_ENGINE.createInitialGameState();
    let currentHistoryViewIndex = -1;

    // ==========================================
    // 實時監聽 (純接收，絕不寫入)
    // ==========================================
    window.onload = () => {
      matchRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          gameState = Object.assign(RULES_ENGINE.createInitialGameState(), data);
          if (!gameState.players) gameState.players = [];
          if (!gameState.history) gameState.history = [];
          if (!gameState.tempVotes) gameState.tempVotes = {};

          renderAll();
        }

        document.getElementById("syncStatusBadge").innerText = "● 即時同步中";
        document.getElementById("syncStatusBadge").className = "bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] px-1.5 py-0.2 rounded font-bold";
      }, (error) => {
        console.error("Firebase 連線異常:", error);
        document.getElementById("syncStatusBadge").innerText = "⚠️ 連線中斷";
        document.getElementById("syncStatusBadge").className = "bg-rose-950 text-rose-300 border border-rose-800 text-[10px] px-1.5 py-0.2 rounded font-bold";
      });
    };

    function renderAll() {
      renderHeaderAndSections();
      renderHistoryTabs();
      renderSeatsStatus();
      renderLottoVoteDisplay();
    }

    function renderHeaderAndSections() {
      const isPoliceActive = (gameState.phase === "POLICE_ELECTION" || gameState.phase === "POLICE_PK");

      const aliveCount = isPoliceActive
        ? gameState.players.filter(p => p.deathReason !== "EXPLODE" && p.deathReason !== "EXILE").length
        : gameState.players.filter(p => p.isAlive).length;

      document.getElementById("aliveRatioText").innerText = `\${aliveCount} / 12 人`;

      let stageDesc = "";
      if (gameState.phase === "SETUP") {
        stageDesc = "等待上帝完成開局與座位配置...";
      } else if (gameState.phase === "NIGHT") {
        stageDesc = `第 \${gameState.round || 1} 夜 (天黑行動中，請閉眼)`;
      } else if (gameState.phase === "POLICE_ELECTION") {
        if (gameState.consecutiveExplodeCount === 1) {
          stageDesc = `第 \${gameState.day || 1} 天 警長補選 (延續昨日上警名單)`;
        } else {
          stageDesc = `第 \${gameState.day || 1} 天 警長競選 (首輪投票)`;
        }
      } else if (gameState.phase === "POLICE_PK") {
        stageDesc = `第 \${gameState.day || 1} 天 警長競選 ⚖️ 平票 PK 決選`;
      } else {
        if (gameState.isPrinceRevolving) {
          stageDesc = `第 \${gameState.day || 1} 天 白天放逐 ⏳ 定序王子時光倒流重新投票`;
        } else {
          stageDesc = `第 \${gameState.day || 1} 天 白天放逐對局`;
        }
      }

      document.getElementById("currentStageText").innerText = stageDesc;

      const showPoliceSection = (isPoliceActive && currentHistoryViewIndex === -1);
      document.getElementById("policeSection").classList.toggle("hidden", !showPoliceSection);

      let badgeLabelText = "警長：未指定";
      if (gameState.isBadgeTorn) {
        badgeLabelText = "警長：警徽已流失/撕毀";
      } else if (gameState.policeSeat) {
        badgeLabelText = `警長：\${gameState.policeSeat} 號 (1.5票)`;
      }
      document.getElementById("badgeHolderLabel").innerText = badgeLabelText;
    }

    function renderHistoryTabs() {
      const container = document.getElementById("historyTabContainer");
      let tabsHtml = "";

      (gameState.history || []).forEach((record, idx) => {
        const isActive = (currentHistoryViewIndex === idx);
        tabsHtml += `
          <button onclick="viewHistory(\${idx})" class="px-2.5 py-1 rounded font-bold whitespace-nowrap transition border \${isActive ? 'bg-amber-500 text-black border-amber-300' : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700'}">
            \${record.title}
          </button>
        `;
      });

      const isCurrentActive = (currentHistoryViewIndex === -1);
      let currentTitle = "";
      if (gameState.phase === "SETUP") currentTitle = "即時: 開局中";
      else if (gameState.phase === "NIGHT") currentTitle = `即時: 第\${gameState.round || 1}夜`;
      else if (gameState.phase === "POLICE_ELECTION") currentTitle = `即時: D\${gameState.day || 1}警選`;
      else if (gameState.phase === "POLICE_PK") currentTitle = `即時: D\${gameState.day || 1}警長PK`;
      else {
        currentTitle = gameState.isPrinceRevolving ? `即時: D\${gameState.day || 1}放逐重投` : `即時: D\${gameState.day || 1}放逐`;
      }

      tabsHtml += `
        <button onclick="viewHistory(-1)" class="px-2.5 py-1 rounded font-bold whitespace-nowrap transition border \${isCurrentActive ? 'bg-blue-600 text-white border-blue-400' : 'bg-gray-800 text-gray-400 border-gray-700 hover:bg-gray-700'}">
          ● \${currentTitle}
        </button>
      `;

      container.innerHTML = tabsHtml;
    }

    function viewHistory(idx) {
      currentHistoryViewIndex = idx;
      renderAll();
    }

    function renderSeatsStatus() {
      const isPoliceActive = (gameState.phase === "POLICE_ELECTION" || gameState.phase === "POLICE_PK");
      const isPkMode = (gameState.phase === "POLICE_PK");
      const pkCandidates = gameState.pkCandidates || [];

      const candidates = isPoliceActive
        ? gameState.players.filter(p => p.isCandidate && p.deathReason !== "EXPLODE" && p.deathReason !== "EXILE")
        : gameState.players.filter(p => p.isCandidate && p.isAlive);
      
      const voters = gameState.players.filter(p => {
        const isNotExiledOrExploded = (p.deathReason !== "EXPLODE" && p.deathReason !== "EXILE");
        const effectivelyAlive = isPoliceActive ? isNotExiledOrExploded : p.isAlive;
        if (!effectivelyAlive) return false;

        if (!isPkMode) {
          return !p.isCandidate;
        } else {
          const isEligibleVoter = (!p.isCandidate || p.hasDropped);
          return isEligibleVoter && !pkCandidates.includes(p.seat);
        }
      });

      document.getElementById("candidateCountLabel").innerText = isPkMode ? `\${pkCandidates.length} 人角逐 PK` : `\${candidates.length} 人上警`;
      document.getElementById("votersCountLabel").innerText = `\${voters.length} 人有投票權`;

      // 1. 警上候選人區
      const candGrid = document.getElementById("candidatesGrid");
      if (candidates.length === 0) {
        candGrid.innerHTML = `<div class="col-span-6 lg:col-span-12 text-gray-500 text-xs text-center py-2">目前無人上警</div>`;
      } else {
        candGrid.innerHTML = candidates.map(p => {
          let borderStyle = "border-amber-500/70 bg-amber-950/30 text-amber-300 font-bold";
          let statusLabel = "競選中";
          let statusColor = "text-amber-400";

          if (p.hasDropped) {
            borderStyle = "border-gray-700 bg-gray-800/40 text-gray-500";
            statusLabel = "已退水 (有票)";
            statusColor = "text-blue-400";
          } else if (isPkMode) {
            if (pkCandidates.includes(p.seat)) {
              borderStyle = "border-amber-400 bg-amber-500/20 text-amber-200 font-extrabold ring-1 ring-amber-400";
              statusLabel = "👑 PK候選";
              statusColor = "text-amber-300 font-bold";
            } else {
              borderStyle = "border-rose-900/60 bg-rose-950/20 text-gray-500 opacity-60";
              statusLabel = "未退水(無票)";
              statusColor = "text-rose-400";
            }
          }

          const playerName = p.name ? p.name.slice(0, 4) : '';

          return `
            <div class="h-10 rounded-lg border \${borderStyle} flex flex-col items-center justify-center text-xs relative">
              \${Number(gameState.policeSeat) === Number(p.seat) ? '<span class="absolute -top-1.5 -right-1 text-xs">👑</span>' : ''}
              <span>\${p.seat < 10 ? '0' + p.seat : p.seat} <span class="text-[9px] font-normal">\${playerName}</span></span>
              <span class="text-[9px] ${statusColor}">${statusLabel}</span>
            </div>
          `;
        }).join('');
      }

      // 2. 警下投票區
      const voterGrid = document.getElementById("votersGrid");
      if (voters.length === 0) {
        voterGrid.innerHTML = `<div class="col-span-6 lg:col-span-12 text-gray-500 text-xs text-center py-2">全場無合資格選民</div>`;
      } else {
        voterGrid.innerHTML = voters.map(p => {
          const playerName = p.name ? p.name.slice(0, 4) : '';
          return `
            <div class="h-10 rounded-lg border border-blue-500/50 bg-blue-950/20 text-blue-200 flex flex-col items-center justify-center text-xs font-mono font-bold">
              \${Number(gameState.policeSeat) === Number(p.seat) ? '<span class="absolute -top-1.5 -right-1 text-xs">👑</span>' : ''}
              <span>\${p.seat < 10 ? '0' + p.seat : p.seat} <span class="text-[9px] font-normal">\${playerName}</span></span>
              <span class="text-[9px] text-blue-400 font-normal">\${p.hasDropped ? '退水選民' : '警下選民'}</span>
            </div>
          `;
        }).join('');
      }

      // 3. 全場席位存活狀態（嚴格黑盒保護：只顯示席位、玩家名字與出局死因圖標，絕不顯示角色資訊）
      const stdGrid = document.getElementById("standardSeatsGrid");
      stdGrid.innerHTML = gameState.players.map(p => {
        let cardStyle = "seat-alive";
        let badgeHtml = "";
        let statusText = p.name ? p.name.slice(0, 4) : "存活";
        let textStyle = "text-gray-400";
        let seatNumStyle = "";

        const isNightDeadHidden = (isPoliceActive && !p.isAlive && p.deathReason === "NIGHT");

        if (p.isAlive || isNightDeadHidden) {
          if (Number(gameState.policeSeat) === Number(p.seat)) {
            cardStyle = "seat-police";
            badgeHtml = '<span class="absolute -top-2 -right-1 text-xs">👑</span>';
            textStyle = "text-amber-300 font-bold";
          }
        } else {
          seatNumStyle = "line-through opacity-60";
          if (p.deathReason === "NIGHT") {
            cardStyle = "seat-night-dead";
            badgeHtml = '<span class="absolute -top-1.5 -right-1 text-[11px] bg-purple-950 border border-purple-600 rounded-full w-4 h-4 flex items-center justify-center">🌙</span>';
            statusText = "夜亡";
            textStyle = "text-purple-400 font-bold";
          } else if (p.deathReason === "EXILE") {
            cardStyle = "seat-exile-dead";
            badgeHtml = '<span class="absolute -top-1.5 -right-1 text-[11px] bg-rose-950 border border-rose-600 rounded-full w-4 h-4 flex items-center justify-center">❌</span>';
            statusText = "放逐";
            textStyle = "text-rose-400 font-bold";
          } else if (p.deathReason === "SKILL") {
            cardStyle = "seat-skill-dead";
            badgeHtml = '<span class="absolute -top-1.5 -right-1 text-[11px] bg-orange-950 border border-orange-600 rounded-full w-4 h-4 flex items-center justify-center">🎯</span>';
            statusText = "技能";
            textStyle = "text-orange-400 font-bold";
          } else if (p.deathReason === "EXPLODE") {
            cardStyle = "seat-explode-dead";
            badgeHtml = '<span class="absolute -top-1.5 -right-1 text-[11px] bg-red-950 border border-red-600 rounded-full w-4 h-4 flex items-center justify-center">💥</span>';
            statusText = "自爆";
            textStyle = "text-red-400 font-bold";
          }
        }

        const seatLabel = p.seat < 10 ? '0' + p.seat : p.seat;

        return `
          <div class="h-11 rounded-lg \${cardStyle} flex flex-col items-center justify-center text-xs font-bold relative transition">
            \${badgeHtml}
            <span class="${seatNumStyle}">${seatLabel}</span>
            <span class="text-[9px] \${textStyle} truncate px-0.5">\${statusText}</span>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // 彩球票型渲染
    // ==========================================
    function renderLottoVoteDisplay() {
      const container = document.getElementById("lottoVotesContainer");
      const titleEl = document.getElementById("voteSummaryTitle");
      const badgeEl = document.getElementById("voteSummaryBadge");

      let currentDisplayVotes = {};
      let isHistoryView = (currentHistoryViewIndex !== -1);
      let effectiveBadgeHolder = null;
      let isElectionStage = false;

      if (isHistoryView) {
        const histItem = (gameState.history || [])[currentHistoryViewIndex];
        if (!histItem) return;
        currentDisplayVotes = histItem.votes || {};
        titleEl.innerText = `歷史紀錄：\${histItem.title}`;
        badgeEl.innerText = histItem.badgeText || "已結算";
        badgeEl.className = "text-xs bg-amber-950 text-amber-300 border border-amber-700 px-2 py-0.5 rounded font-bold";
        effectiveBadgeHolder = (histItem.badgeHolder !== undefined) ? histItem.badgeHolder : ((!gameState.isBadgeTorn) ? gameState.policeSeat : null);
        isElectionStage = histItem.title.includes("警選") || histItem.title.includes("警長競選");
      } else {
        currentDisplayVotes = gameState.tempVotes || {};
        effectiveBadgeHolder = (!gameState.isBadgeTorn) ? gameState.policeSeat : null;
        isElectionStage = (gameState.phase === "POLICE_ELECTION" || gameState.phase === "POLICE_PK");

        if (gameState.phase === "POLICE_ELECTION") {
          titleEl.innerText = `即時：第 \${gameState.day || 1} 天 警長競選首輪票型`;
        } else if (gameState.phase === "POLICE_PK") {
          titleEl.innerText = `即時：第 \${gameState.day || 1} 天 警長 PK 決選票型`;
        } else {
          titleEl.innerText = gameState.isPrinceRevolving 
            ? `即時：第 \${gameState.day || 1} 天 放逐重投票型 (定序倒流)` 
            : `即時：第 \${gameState.day || 1} 天 放逐票型`;
        }
        badgeEl.innerText = "即時開票中";
        badgeEl.className = "text-xs bg-blue-950 text-blue-300 border border-blue-700 px-2 py-0.5 rounded font-bold";
      }

      const lottoGroups = RULES_ENGINE.calculateLottoTallies(currentDisplayVotes, effectiveBadgeHolder, isElectionStage);

      if (lottoGroups.length === 0) {
        container.innerHTML = `<div class="text-gray-500 text-xs text-center py-8">此輪尚無有效投票紀錄</div>`;
        return;
      }

      container.innerHTML = lottoGroups.map(group => {
        const voterBallsHtml = group.voters.map(v => {
          const ballClass = v.isPolice ? "ball-police-voter" : "ball-voter";
          const crownHtml = v.isPolice ? '<span class="absolute -top-2 -right-1 text-[11px]">👑</span>' : '';
          return `<div class="lotto-ball \${ballClass}">${crownHtml}${v.label}</div>`;
        }).join('');

        const targetBallClass = group.isAbstain ? "ball-abstain" : "ball-target";

        return `
          <div class="bg-gray-800/80 p-3 rounded-xl border border-gray-700 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="lotto-ball lotto-ball-lg \${targetBallClass}">
                \${group.label}
              </div>
              <div>
                <div class="text-xs font-bold \${group.isAbstain ? 'text-gray-400' : 'text-amber-300'}">
                  \${group.title}
                </div>
                <div class="text-[11px] font-mono text-gray-400">
                  得票：<span class="text-amber-400 font-bold">${group.totalPoints}</span> 票 (${group.voters.length}人)
                </div>
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-1.5 flex-1 pl-2">
              \${voterBallsHtml}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
