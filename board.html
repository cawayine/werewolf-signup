<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>基地狼人殺 - 現場公播看板</title>

  <!-- 強制瀏覽器不使用快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f17; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .neon-border { border: 1px solid #30363d; }
    .dead-seat { text-decoration: line-through; opacity: 0.35; filter: grayscale(1); }

    /* 樂透彩球專屬立體視覺 */
    .lotto-ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      box-shadow: inset -2px -3px 6px rgba(0, 0, 0, 0.45), inset 2px 2px 5px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0,0,0,0.5);
      position: relative;
      flex-shrink: 0;
    }
    .lotto-ball-lg {
      width: 46px;
      height: 46px;
      font-size: 20px;
    }
    .ball-target {
      background: radial-gradient(circle at 35% 35%, #f59e0b, #b45309);
      border: 1px solid #fbbf24;
    }
    .ball-voter {
      background: radial-gradient(circle at 35% 35%, #3b82f6, #1d4ed8);
      border: 1px solid #60a5fa;
    }
    .ball-police-voter {
      background: radial-gradient(circle at 35% 35%, #ec4899, #be185d);
      border: 2px solid #fde047;
      box-shadow: inset -2px -3px 6px rgba(0, 0, 0, 0.45), inset 2px 2px 5px rgba(255, 255, 255, 0.4), 0 0 10px rgba(234, 179, 8, 0.6);
    }
    .ball-abstain {
      background: radial-gradient(circle at 35% 35%, #6b7280, #374151);
      border: 1px solid #9ca3af;
    }
  </style>
</head>
<body class="p-3 max-w-xl mx-auto pb-32">

  <!-- 頂部即時公播標題列 -->
  <header class="flex justify-between items-center py-2.5 px-3 bg-gray-900 rounded-xl neon-border mb-3 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-900/60 border border-indigo-500/50 flex items-center justify-center text-indigo-400">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h1 class="text-sm font-black text-gray-100 flex items-center gap-1.5">
          基地公播看板 <span class="bg-indigo-950 text-indigo-300 border border-indigo-800 text-[10px] px-1.5 py-0.2 rounded font-bold">即時公播</span>
        </h1>
        <span class="text-[11px] text-amber-300 font-mono font-bold" id="currentStageText">第 1 天 警長競選</span>
      </div>
    </div>
    <div class="text-right">
      <div class="text-[10px] text-gray-400">存活狀態</div>
      <div class="text-sm font-bold text-emerald-400 font-mono" id="aliveRatioText">12 / 12 人</div>
    </div>
  </header>

  <!-- 歷史投票輪次切換頁籤 -->
  <nav class="flex gap-1.5 overflow-x-auto pb-2 mb-2 text-xs scrollbar-none" id="historyTabContainer">
    <!-- 動態生成輪次標籤 -->
  </nav>

  <!-- 階段 A：警長競選專屬面板 (首輪警長競選時顯示) -->
  <section id="policeSection" class="space-y-3 mb-3">
    <!-- 警上候選人區 -->
    <div class="bg-gray-900 rounded-xl neon-border p-3 border-amber-500/40">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-crown text-amber-400"></i> 🔥 警上競選區 (候選人)
        </span>
        <span class="text-[10px] text-gray-400" id="candidateCountLabel">0 人上警</span>
      </div>
      <div class="grid grid-cols-6 gap-1.5" id="candidatesGrid"></div>
    </div>

    <!-- 警下投票區 -->
    <div class="bg-gray-900 rounded-xl neon-border p-3 border-blue-500/40">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-blue-400 flex items-center gap-1.5">
          <i class="fa-solid fa-check-to-slot text-blue-400"></i> 🛡️ 警下投票區 (擁有投票權)
        </span>
        <span class="text-[10px] text-gray-400" id="votersCountLabel">12 人在警下</span>
      </div>
      <div class="grid grid-cols-6 gap-1.5" id="votersGrid"></div>
    </div>
  </section>

  <!-- 階段 B：席位即時存活點陣 -->
  <section id="seatStatusSection" class="space-y-3 mb-3">
    <div class="bg-gray-900 rounded-xl neon-border p-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
          <i class="fa-solid fa-users"></i> 全場席位存活狀態
        </span>
        <span class="text-[10px] text-amber-400 font-bold" id="badgeHolderLabel">警長：未指定</span>
      </div>
      <div class="grid grid-cols-6 gap-1.5" id="standardSeatsGrid"></div>
    </div>
  </section>

  <!-- 核心重點：當前選定輪次的「樂透彩球票型看板」 -->
  <section class="bg-gray-900 rounded-xl neon-border p-3 mb-3">
    <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-gray-800">
      <span class="text-xs font-bold text-gray-200 flex items-center gap-1.5">
        <i class="fa-solid fa-square-poll-vertical text-amber-400"></i>
        <span id="voteSummaryTitle">票型開票結果</span>
      </span>
      <span id="voteSummaryBadge" class="text-xs bg-gray-800 text-gray-400 px-2 py-0.5 rounded font-bold">
        等待計票
      </span>
    </div>

    <!-- 樂透彩球票型清單 -->
    <div id="lottoVotesContainer" class="space-y-2.5">
      <div class="text-gray-500 text-xs text-center py-6">尚未輸入投票票型</div>
    </div>
  </section>

  <!-- 底部固定：計票員操作彈窗呼叫按鈕 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-gray-800 p-2.5 z-40">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="text-xs">
        <span class="text-gray-400">目前輪次：</span>
        <span class="text-amber-400 font-bold" id="drawerStageStatusText">第 1 天 警長競選</span>
      </div>
      <button onclick="toggleControlDrawer()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow transition">
        <i class="fa-solid fa-pen-to-square"></i> 開啟計票面板
      </button>
    </div>
  </footer>

  <!-- 計票員操作抽屜 (控制端) -->
  <div id="controlDrawer" class="fixed inset-x-0 bottom-0 bg-gray-900 border-t border-gray-700 p-3 z-50 rounded-t-2xl shadow-2xl max-w-xl mx-auto hidden max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-center pb-2 mb-2 border-b border-gray-800">
      <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
        <i class="fa-solid fa-calculator"></i> 現場計票控制端
      </h3>
      <button onclick="toggleControlDrawer()" class="text-gray-400 hover:text-white text-sm px-2">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 模式 1：警長競選計票模組 -->
    <div id="drawerPoliceModule" class="space-y-2.5">
      <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
        <span class="text-xs font-bold text-gray-200 block mb-1.5">步驟 1：登記上警名單 (點選切換)</span>
        <div class="grid grid-cols-6 gap-1" id="drawerCandidateToggleGrid"></div>
      </div>

      <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
        <span class="text-xs font-bold text-gray-200 block mb-1">步驟 2：警長計票 (先選候選人 ➔ 點警下選民)</span>
        <div class="text-[11px] text-amber-300 mb-1">選擇受票候選人：</div>
        <div class="flex flex-wrap gap-1.5 mb-2" id="drawerPoliceTargetCandidatesContainer"></div>
        <div class="text-[11px] text-blue-300 mb-1">警下投票人點擊投票：</div>
        <div class="grid grid-cols-6 gap-1 mb-2" id="drawerPoliceEligibleVotersGrid"></div>
        
        <button onclick="confirmPoliceElection()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded text-xs shadow">
          確認警長當選並封存此輪
        </button>
      </div>
    </div>

    <!-- 模式 2：白天放逐計票模組 (通用輪次) -->
    <div id="drawerExileModule" class="space-y-2.5 hidden">
      <!-- 夜間死訊更新 -->
      <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-bold text-rose-300">更新夜間倒牌死訊 (點選出局)</span>
          <span class="text-[10px] text-gray-400">平安夜則無需點選</span>
        </div>
        <div class="grid grid-cols-6 gap-1" id="drawerNightDeathGrid"></div>
      </div>

      <!-- 放逐投票計票 -->
      <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700">
        <span class="text-xs font-bold text-gray-200 block mb-1">放逐計票 (先選被投人 ➔ 點投票選民)</span>
        <div class="text-[11px] text-amber-300 mb-1">選擇放逐目標：</div>
        <div class="flex flex-wrap gap-1.5 mb-2" id="drawerExileTargetContainer"></div>
        <div class="text-[11px] text-emerald-300 mb-1">存活選民投票 (警長自動計 1.5 票)：</div>
        <div class="grid grid-cols-6 gap-1 mb-2" id="drawerExileVotersGrid"></div>

        <div class="flex gap-2 mt-2">
          <button onclick="confirmExileVote()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded text-xs shadow">
            確認放逐出局並封存票型
          </button>
          <button onclick="enterNextDayCycle()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded text-xs shadow">
            進入下一天 ➔
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let gameState = {
      day: 1,
      phase: "POLICE_ELECTION",
      policeSeat: null,
      players: Array.from({ length: 12 }, (_, i) => ({
        seat: i + 1,
        isAlive: true,
        isCandidate: false,
        hasDropped: false
      })),
      history: [],
      currentHistoryViewIndex: -1,
      tempVotes: {},
      selectedTarget: null
    };

    window.onload = () => {
      renderAll();
    };

    function renderAll() {
      renderHeaderAndSections();
      renderHistoryTabs();
      renderSeatsStatus();
      renderLottoVoteDisplay();
      renderDrawerControls();
    }

    function renderHeaderAndSections() {
      const aliveCount = gameState.players.filter(p => p.isAlive).length;
      document.getElementById("aliveRatioText").innerText = `${aliveCount} / 12 人`;

      const stageDesc = gameState.phase === "POLICE_ELECTION" 
        ? `第 ${gameState.day} 天 警長競選` 
        : `第 ${gameState.day} 天 白天放逐公投`;

      document.getElementById("currentStageText").innerText = stageDesc;
      document.getElementById("drawerStageStatusText").innerText = stageDesc;

      const isPoliceActive = (gameState.phase === "POLICE_ELECTION" && gameState.currentHistoryViewIndex === -1);
      document.getElementById("policeSection").classList.toggle("hidden", !isPoliceActive);

      document.getElementById("badgeHolderLabel").innerText = gameState.policeSeat 
        ? `警長：${gameState.policeSeat} 號 (1.5票)` 
        : "警長：未指定";
    }

    function renderHistoryTabs() {
      const container = document.getElementById("historyTabContainer");
      let tabsHtml = "";

      gameState.history.forEach((record, idx) => {
        const isActive = (gameState.currentHistoryViewIndex === idx);
        tabsHtml += `
          <button onclick="viewHistory(${idx})" class="px-2.5 py-1 rounded font-bold whitespace-nowrap transition border ${isActive ? 'bg-amber-500 text-black border-amber-300' : 'bg-gray-800 text-gray-300 border-gray-700 hover:bg-gray-700'}">
            ${record.title}
          </button>
        `;
      });

      const isCurrentActive = (gameState.currentHistoryViewIndex === -1);
      const currentTitle = gameState.phase === "POLICE_ELECTION" ? "即時: 警長競選" : `即時: D${gameState.day}放逐`;
      tabsHtml += `
        <button onclick="viewHistory(-1)" class="px-2.5 py-1 rounded font-bold whitespace-nowrap transition border ${isCurrentActive ? 'bg-blue-600 text-white border-blue-400' : 'bg-gray-800 text-gray-400 border-gray-700 hover:bg-gray-700'}">
          ● ${currentTitle}
        </button>
      `;

      container.innerHTML = tabsHtml;
    }

    function viewHistory(idx) {
      gameState.currentHistoryViewIndex = idx;
      renderAll();
    }

    function renderSeatsStatus() {
      const candidates = gameState.players.filter(p => p.isCandidate);
      const voters = gameState.players.filter(p => !p.isCandidate && p.isAlive);

      document.getElementById("candidateCountLabel").innerText = `${candidates.length} 人上警`;
      document.getElementById("votersCountLabel").innerText = `${voters.length} 人在警下`;

      const candGrid = document.getElementById("candidatesGrid");
      if (candidates.length === 0) {
        candGrid.innerHTML = `<div class="col-span-6 text-gray-500 text-xs text-center py-2">目前無人上警</div>`;
      } else {
        candGrid.innerHTML = candidates.map(p => `
          <div class="h-10 rounded-lg border ${p.hasDropped ? 'border-gray-700 bg-gray-800/40 text-gray-500' : 'border-amber-500/70 bg-amber-950/30 text-amber-300 font-bold'} flex flex-col items-center justify-center text-xs relative">
            ${gameState.policeSeat === p.seat ? '<span class="absolute -top-1.5 -right-1 text-xs">👑</span>' : ''}
            <span>${p.seat < 10 ? '0' + p.seat : p.seat}</span>
            <span class="text-[9px] ${p.hasDropped ? 'text-gray-600' : 'text-amber-400'}">${p.hasDropped ? '已退水' : '競選中'}</span>
          </div>
        `).join('');
      }

      const voterGrid = document.getElementById("votersGrid");
      if (voters.length === 0) {
        voterGrid.innerHTML = `<div class="col-span-6 text-gray-500 text-xs text-center py-2">全員上警</div>`;
      } else {
        voterGrid.innerHTML = voters.map(p => `
          <div class="h-10 rounded-lg border border-blue-500/50 bg-blue-950/20 text-blue-200 flex flex-col items-center justify-center text-xs font-mono font-bold">
            ${gameState.policeSeat === p.seat ? '<span class="absolute -top-1.5 -right-1 text-xs">👑</span>' : ''}
            <span>${p.seat < 10 ? '0' + p.seat : p.seat}</span>
            <span class="text-[9px] text-blue-400 font-normal">投票人</span>
          </div>
        `).join('');
      }

      const stdGrid = document.getElementById("standardSeatsGrid");
      stdGrid.innerHTML = gameState.players.map(p => `
        <div class="h-11 rounded-lg border ${p.isAlive ? (gameState.policeSeat === p.seat ? 'border-amber-500 bg-amber-950/40 text-amber-300' : 'border-gray-700 bg-gray-800 text-gray-200') : 'dead-seat border-rose-900 bg-rose-950/20 text-rose-500'} flex flex-col items-center justify-center text-xs font-bold relative">
          ${gameState.policeSeat === p.seat ? '<span class="absolute -top-1.5 -right-1 text-xs">👑</span>' : ''}
          <span>${p.seat < 10 ? '0' + p.seat : p.seat}</span>
          <span class="text-[9px] font-normal ${p.isAlive ? 'text-gray-400' : 'text-rose-400'}">${p.isAlive ? '存活' : '出局'}</span>
        </div>
      `).join('');
    }

    // 核心修復：乾淨安全的樂透彩球字串渲染
    function renderLottoVoteDisplay() {
      const container = document.getElementById("lottoVotesContainer");
      const titleEl = document.getElementById("voteSummaryTitle");
      const badgeEl = document.getElementById("voteSummaryBadge");

      let currentDisplayVotes = {};
      let isHistoryView = (gameState.currentHistoryViewIndex !== -1);

      if (isHistoryView) {
        const histItem = gameState.history[gameState.currentHistoryViewIndex];
        currentDisplayVotes = histItem.votes || {};
        titleEl.innerText = `歷史紀錄：${histItem.title}`;
        badgeEl.innerText = histItem.badgeText || "已結算";
        badgeEl.className = "text-xs bg-amber-950 text-amber-300 border border-amber-700 px-2 py-0.5 rounded font-bold";
      } else {
        currentDisplayVotes = gameState.tempVotes;
        titleEl.innerText = (gameState.phase === "POLICE_ELECTION") ? "即時：警長競選票型" : `即時：第 ${gameState.day} 天放逐票型`;
        badgeEl.innerText = "即時開票中";
        badgeEl.className = "text-xs bg-blue-950 text-blue-300 border border-blue-700 px-2 py-0.5 rounded font-bold";
      }

      const targetKeys = Object.keys(currentDisplayVotes);
      if (targetKeys.length === 0) {
        container.innerHTML = `<div class="text-gray-500 text-xs text-center py-6">此輪尚無投票紀錄</div>`;
        return;
      }

      let cardsHtml = "";
      targetKeys.forEach(targetKey => {
        const voters = currentDisplayVotes[targetKey] || [];
        if (voters.length === 0) return;

        const targetSeatNum = parseInt(targetKey);
        const isAbstain = (targetSeatNum === 0);

        let totalPoints = 0;
        let voterBallsHtml = "";

        voters.forEach(vSeat => {
          const isPolice = (vSeat === gameState.policeSeat);
          if (gameState.phase !== "POLICE_ELECTION" && isPolice) {
            totalPoints += 1.5;
          } else {
            totalPoints += 1;
          }

          const vLabel = (vSeat < 10) ? ("0" + vSeat) : String(vSeat);
          const ballClass = isPolice ? "ball-police-voter" : "ball-voter";
          const crownHtml = isPolice ? '<span class="absolute -top-2 -right-1 text-[11px]">👑</span>' : '';

          voterBallsHtml += '<div class="lotto-ball ' + ballClass + '">' + crownHtml + vLabel + '</div>';
        });

        const targetBallClass = isAbstain ? "ball-abstain" : "ball-target";
        const targetBallLabel = isAbstain ? "棄" : ((targetSeatNum < 10) ? ("0" + targetSeatNum) : String(targetSeatNum));
        const targetTitle = isAbstain ? "棄票" : (targetSeatNum + " 號候選人");

        cardsHtml += `
          <div class="bg-gray-800/80 p-3 rounded-xl border border-gray-700 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="lotto-ball lotto-ball-lg ${targetBallClass}">
                ${targetBallLabel}
              </div>
              <div>
                <div class="text-xs font-bold ${isAbstain ? 'text-gray-400' : 'text-amber-300'}">
                  ${targetTitle}
                </div>
                <div class="text-[11px] font-mono text-gray-400">
                  得票：<span class="text-amber-400 font-bold">${totalPoints}</span> 票 (${voters.length}人)
                </div>
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-1.5 flex-1 pl-2">
              ${voterBallsHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = cardsHtml || `<div class="text-gray-500 text-xs text-center py-6">此輪尚無有效得票</div>`;
    }

    function toggleControlDrawer() {
      const drawer = document.getElementById("controlDrawer");
      drawer.classList.toggle("hidden");
    }

    function renderDrawerControls() {
      const isPoliceMode = (gameState.phase === "POLICE_ELECTION");
      document.getElementById("drawerPoliceModule").classList.toggle("hidden", !isPoliceMode);
      document.getElementById("drawerExileModule").classList.toggle("hidden", isPoliceMode);

      if (isPoliceMode) {
        renderPoliceDrawerControls();
      } else {
        renderExileDrawerControls();
      }
    }

    function renderPoliceDrawerControls() {
      const toggleGrid = document.getElementById("drawerCandidateToggleGrid");
      toggleGrid.innerHTML = gameState.players.map(p => `
        <button onclick="toggleCandidate(${p.seat})" class="h-8 rounded text-xs font-bold border ${p.isCandidate ? 'bg-amber-600 border-amber-400 text-white' : 'bg-gray-800 border-gray-700 text-gray-300'}">
          ${p.seat}號
        </button>
      `).join('');

      const candContainer = document.getElementById("drawerPoliceTargetCandidatesContainer");
      const activeCandidates = gameState.players.filter(p => p.isCandidate && !p.hasDropped);
      
      if (activeCandidates.length === 0) {
        candContainer.innerHTML = `<span class="text-xs text-gray-500">無候選人</span>`;
      } else {
        candContainer.innerHTML = activeCandidates.map(p => `
          <button onclick="selectTargetForVote(${p.seat})" class="px-2.5 py-1 rounded text-xs font-bold border ${gameState.selectedTarget === p.seat ? 'bg-amber-500 text-black border-amber-300' : 'bg-gray-800 text-amber-300 border-gray-600'}">
            投 ${p.seat}號
          </button>
        `).join('') + `
          <button onclick="selectTargetForVote(0)" class="px-2.5 py-1 rounded text-xs font-bold border ${gameState.selectedTarget === 0 ? 'bg-gray-400 text-black border-white' : 'bg-gray-800 text-gray-400 border-gray-600'}">
            棄票
          </button>
        `;
      }

      const votersGrid = document.getElementById("drawerPoliceEligibleVotersGrid");
      const eligibleVoters = gameState.players.filter(p => !p.isCandidate && p.isAlive);
      
      votersGrid.innerHTML = eligibleVoters.map(p => {
        let votedTarget = null;
        Object.entries(gameState.tempVotes).forEach(([cand, list]) => {
          if (list.includes(p.seat)) votedTarget = cand;
        });

        return `
          <button onclick="assignVote(${p.seat})" class="h-9 rounded text-xs border font-mono flex flex-col items-center justify-center ${votedTarget !== null ? 'bg-indigo-950 border-indigo-400 text-indigo-200' : 'bg-gray-800 border-gray-700 text-gray-300'}">
            <span>${p.seat}號</span>
            <span class="text-[8px] text-amber-300">${votedTarget !== null ? (votedTarget == 0 ? '棄' : '➔' + votedTarget) : '未投'}</span>
          </button>
        `;
      }).join('');
    }

    function renderExileDrawerControls() {
      const deathGrid = document.getElementById("drawerNightDeathGrid");
      deathGrid.innerHTML = gameState.players.map(p => `
        <button onclick="togglePlayerDeath(${p.seat})" class="h-8 rounded text-xs font-bold border ${!p.isAlive ? 'bg-rose-900 border-rose-500 text-rose-200 line-through' : 'bg-gray-800 border-gray-700 text-gray-300'}">
          ${p.seat}號
        </button>
      `).join('');

      const targetContainer = document.getElementById("drawerExileTargetContainer");
      const alivePlayers = gameState.players.filter(p => p.isAlive);

      targetContainer.innerHTML = alivePlayers.map(p => `
        <button onclick="selectTargetForVote(${p.seat})" class="px-2.5 py-1 rounded text-xs font-bold border ${gameState.selectedTarget === p.seat ? 'bg-amber-500 text-black border-amber-300' : 'bg-gray-800 text-amber-300 border-gray-600'}">
          投 ${p.seat}號
        </button>
      `).join('') + `
        <button onclick="selectTargetForVote(0)" class="px-2.5 py-1 rounded text-xs font-bold border ${gameState.selectedTarget === 0 ? 'bg-gray-400 text-black border-white' : 'bg-gray-800 text-gray-400 border-gray-600'}">
          棄票
        </button>
      `;

      const votersGrid = document.getElementById("drawerExileVotersGrid");
      votersGrid.innerHTML = alivePlayers.map(p => {
        let votedTarget = null;
        Object.entries(gameState.tempVotes).forEach(([target, list]) => {
          if (list.includes(p.seat)) votedTarget = target;
        });

        const isPolice = (p.seat === gameState.policeSeat);
        return `
          <button onclick="assignVote(${p.seat})" class="h-9 rounded text-xs border font-mono flex flex-col items-center justify-center ${votedTarget !== null ? 'bg-indigo-950 border-indigo-400 text-indigo-200' : 'bg-gray-800 border-gray-700 text-gray-300'}">
            <span>${p.seat}號${isPolice ? '👑' : ''}</span>
            <span class="text-[8px] text-amber-300">${votedTarget !== null ? (votedTarget == 0 ? '棄' : '➔' + votedTarget) : '未投'}</span>
          </button>
        `;
      }).join('');
    }

    function toggleCandidate(seat) {
      const p = gameState.players.find(x => x.seat === seat);
      p.isCandidate = !p.isCandidate;
      p.hasDropped = false;
      renderAll();
    }

    function selectTargetForVote(targetSeat) {
      gameState.selectedTarget = targetSeat;
      renderDrawerControls();
    }

    function assignVote(voterSeat) {
      if (gameState.selectedTarget === null) {
        alert("請先點選上方的受票目標或棄票！");
        return;
      }
      const target = gameState.selectedTarget;

      Object.keys(gameState.tempVotes).forEach(k => {
        gameState.tempVotes[k] = gameState.tempVotes[k].filter(s => s !== voterSeat);
      });

      if (!gameState.tempVotes[target]) gameState.tempVotes[target] = [];
      gameState.tempVotes[target].push(voterSeat);

      gameState.currentHistoryViewIndex = -1;
      renderAll();
    }

    function togglePlayerDeath(seat) {
      const p = gameState.players.find(x => x.seat === seat);
      p.isAlive = !p.isAlive;
      renderAll();
    }

    function confirmPoliceElection() {
      let maxVotes = 0;
      let winnerSeat = null;

      Object.entries(gameState.tempVotes).forEach(([cand, voters]) => {
        if (cand != 0 && voters.length > maxVotes) {
          maxVotes = voters.length;
          winnerSeat = parseInt(cand);
        }
      });

      if (!winnerSeat) {
        if (!confirm("平票或尚未產生獲勝者，確定要直接封存這輪票型嗎？")) return;
      } else {
        gameState.policeSeat = winnerSeat;
      }

      gameState.history.push({
        title: `D1 警長競選`,
        badgeText: winnerSeat ? `👑 ${winnerSeat}號當選警長` : "競選結束",
        votes: JSON.parse(JSON.stringify(gameState.tempVotes))
      });

      gameState.phase = "DAY_EXILE";
      gameState.tempVotes = {};
      gameState.selectedTarget = null;
      gameState.currentHistoryViewIndex = -1;

      renderAll();
      alert(`🎉 警長競選完成！票型已封存，系統自動進入【第 1 天 白天放逐】階段。`);
    }

    function confirmExileVote() {
      let maxPoints = 0;
      let exiledSeat = null;

      Object.entries(gameState.tempVotes).forEach(([target, voters]) => {
        if (target != 0) {
          let points = 0;
          voters.forEach(v => {
            points += (v === gameState.policeSeat ? 1.5 : 1);
          });
          if (points > maxPoints) {
            maxPoints = points;
            exiledSeat = parseInt(target);
          }
        }
      });

      if (exiledSeat) {
        const p = gameState.players.find(x => x.seat === exiledSeat);
        if (p) p.isAlive = false;
      }

      gameState.history.push({
        title: `D${gameState.day} 白天放逐`,
        badgeText: exiledSeat ? `❌ ${exiledSeat}號放逐出局 (${maxPoints}票)` : "平票無人出局",
        votes: JSON.parse(JSON.stringify(gameState.tempVotes))
      });

      gameState.currentHistoryViewIndex = gameState.history.length - 1;
      alert(`✅ 第 ${gameState.day} 天放逐票型已封存！${exiledSeat ? `\${exiledSeat} 號玩家出局。` : '平票無人出局。'}`);
      renderAll();
    }

    function enterNextDayCycle() {
      if (!confirm(`確定要結算今天並進入【第 ${gameState.day + 1} 天】嗎？`)) return;

      gameState.day += 1;
      gameState.phase = "DAY_EXILE";
      gameState.tempVotes = {};
      gameState.selectedTarget = null;
      gameState.currentHistoryViewIndex = -1;

      renderAll();
      alert(`☀️ 已進入第 ${gameState.day} 天白天！請於控制端更新昨夜死訊後進行放逐計票。`);
    }
  </script>
</body>
</html>
